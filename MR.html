  $$('[data-rev-entrega]').forEach(i => i.addEventListener('change', () => { if (!i.value) return; Revisao.marcar([i.dataset.revEntrega], 'data', { dataEntrega: i.value }); toast('Data de entrega ajustada.'); cadRevisao(); }));
}


/* =====================================================================
   DASHBOARD — grade de gráficos redimensionáveis + gráficos novos
   ===================================================================== */
const Dash = {
  ROW: 10, GAP: 16,
  WIDGETS: [
    { id: 'mensal', nome: 'Evolução mensal (ano × ano anterior)', span: 8, h: 430 },
    { id: 'meta', nome: 'Meta do mês', span: 4, h: 130 },
    { id: 'dist', nome: 'Distribuição (Dízimo, Investimento...)', span: 4, h: 284 },
    { id: 'pizzaParc', nome: 'Pizza por parceiro', span: 4, h: 470 },
    { id: 'pizzaCat', nome: 'Pizza por categoria de serviço', span: 4, h: 470 },
    { id: 'aging', nome: 'Idade das pendências', span: 4, h: 470 },
    { id: 'cobr', nome: 'Cobranças dos próximos 7 dias', span: 12, h: 360 },
    { id: 'acum', nome: 'Faturamento acumulado (ano × ano anterior)', span: 6, h: 360 },
    { id: 'caixa', nome: 'Recebido × Despesas por mês', span: 6, h: 360 },
    { id: 'parc', nome: 'Faturamento por parceiro (barras)', span: 6, h: 470 },
    { id: 'serv', nome: 'Serviços mais solicitados', span: 6, h: 470 },
    { id: 'ticket', nome: 'Ticket médio mensal', span: 6, h: 320 },
    { id: 'etapas', nome: 'Produção por etapa (agora)', span: 6, h: 320 },
    { id: 'pend', nome: 'Pendências mais antigas', span: 12, h: 480 }
  ],
  layout() {
    const saved = (DataService.config().dashLayout || []).filter(w => Dash.WIDGETS.some(x => x.id === w.id));
    const out = saved.map(w => ({ ...Dash.WIDGETS.find(x => x.id === w.id), ...w }));
    Dash.WIDGETS.forEach(w => { if (!out.some(x => x.id === w.id)) out.push({ ...w }); });
    return out;
  },
  save(lay) { DataService.saveConfig({ dashLayout: lay.map(({ id, span, h, hidden }) => ({ id, span, h, hidden: !!hidden })) }); },
  rows(h) { return Math.max(6, Math.round((h + Dash.GAP) / (Dash.ROW + Dash.GAP))); },
  wrap(w, html) {
    html = html.replace('xl:col-span-2', '').replace('overflow-hidden mb-6', 'overflow-hidden');
    return `<div class="dash-w" data-w="${w.id}" style="grid-column: span ${w.span} / span ${w.span}; grid-row: span ${Dash.rows(w.h)};">
      <div class="w-tools">
        <button data-action="w-move" data-id="${w.id}" data-dir="-1" title="Mover para trás">${icon('arrowRight', 'w-3.5 h-3.5 rotate-180')}</button>
        <button data-action="w-move" data-id="${w.id}" data-dir="1" title="Mover para frente">${icon('arrowRight', 'w-3.5 h-3.5')}</button>
        <button data-action="w-size" data-id="${w.id}" title="Largura: 1/3 → 1/2 → 2/3 → inteira">${icon('panel', 'w-3.5 h-3.5')}</button>
        <button data-action="w-hide" data-id="${w.id}" title="Ocultar gráfico">${icon('x', 'w-3.5 h-3.5')}</button>
      </div>
      ${html}
      <div class="w-handle" data-handle="${w.id}" title="Arraste para redimensionar"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M16 7 7 16M16 12l-4 4"/></svg></div>
    </div>`;
  },
  update(id, patch) { const lay = Dash.layout(); const w = lay.find(x => x.id === id); if (!w) return; Object.assign(w, patch); Dash.save(lay); renderDashBody(); },
  bindResize() {
    const grid = $('#dashGrid'); if (!grid) return;
    $$('[data-handle]', grid).forEach(hd => hd.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      const el = hd.closest('.dash-w'), id = hd.dataset.handle;
      const lay = Dash.layout(), w = lay.find(x => x.id === id);
      const gW = grid.getBoundingClientRect().width, colW = (gW - 11 * Dash.GAP) / 12;
      const r0 = el.getBoundingClientRect(), x0 = ev.clientX, y0 = ev.clientY;
      let span = w.span, h = w.h;
      el.classList.add('resizing'); hd.setPointerCapture(ev.pointerId);
      const badge = document.createElement('span'); badge.className = 'w-size-badge'; el.appendChild(badge);
      const frac = n => ({ 3: '1/4', 4: '1/3', 6: '1/2', 8: '2/3', 9: '3/4', 12: 'inteira' })[n] || `${n}/12`;
      const move = e => {
        span = Math.min(12, Math.max(3, Math.round((r0.width + (e.clientX - x0) + Dash.GAP) / (colW + Dash.GAP))));
        h = Math.min(1400, Math.max(140, Math.round((r0.height + (e.clientY - y0)) / 10) * 10));
        el.style.gridColumn = `span ${span} / span ${span}`; el.style.gridRow = `span ${Dash.rows(h)}`;
        badge.textContent = `${frac(span)} · ${h}px`;
      };
      const up = () => {
        hd.removeEventListener('pointermove', move); hd.removeEventListener('pointerup', up); hd.removeEventListener('pointercancel', up);
        el.classList.remove('resizing'); badge.remove();
        w.span = span; w.h = h; Dash.save(lay);
      };
      hd.addEventListener('pointermove', move); hd.addEventListener('pointerup', up); hd.addEventListener('pointercancel', up);
    }));
  },
  openConfig() {
    const lay = Dash.layout();
    const sizes = [[3, '1/4'], [4, '1/3'], [6, '1/2'], [8, '2/3'], [9, '3/4'], [12, 'Inteira']];
    Modal.open({
      title: 'Gráficos do Dashboard', subtitle: 'Escolha quais aparecem, a ordem e o tamanho. No Dashboard, arraste o canto inferior direito de cada gráfico para redimensionar.', size: 'lg',
      body: `<div class="space-y-2" id="dcList">${lay.map((w, i) => `
        <div class="flex flex-wrap items-center gap-3 rounded-xl border px-3 py-2.5" style="border-color:var(--line)" data-row="${w.id}">
          <input type="checkbox" class="chk" data-vis ${w.hidden ? '' : 'checked'}>
          <span class="flex-1 min-w-[180px] text-sm font-medium text-slate-700">${w.nome}</span>
          <select class="input !w-auto !min-h-[34px] !py-1 text-xs" data-span>${sizes.map(([v, l]) => `<option value="${v}" ${+w.span === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <div class="relative"><input class="input !w-24 !min-h-[34px] !py-1 text-xs text-right tnum !pr-7" data-h type="number" min="140" step="10" value="${w.h}"><span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400">px</span></div>
          <span class="flex"><button class="icon-btn !w-8 !h-8" data-up ${i === 0 ? 'disabled style="opacity:.3"' : ''} title="Subir">${icon('arrowUp', 'w-3.5 h-3.5')}</button><button class="icon-btn !w-8 !h-8" data-down ${i === lay.length - 1 ? 'disabled style="opacity:.3"' : ''} title="Descer">${icon('arrowDown', 'w-3.5 h-3.5')}</button></span>
        </div>`).join('')}</div>`,
      footer: `<button class="btn btn-ghost mr-auto" data-reset>${icon('refresh')} Restaurar padrão</button><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-ok>${icon('check')} Aplicar</button>`,
      onMount(el, api) {
        const list = $('#dcList', el);
        list.addEventListener('click', e => {
          const row = e.target.closest('[data-row]'); if (!row) return;
          if (e.target.closest('[data-up]') && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
          if (e.target.closest('[data-down]') && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
          $$('[data-row]', list).forEach((r, i, a) => { const u = $('[data-up]', r), d = $('[data-down]', r); u.disabled = i === 0; u.style.opacity = i === 0 ? .3 : 1; d.disabled = i === a.length - 1; d.style.opacity = i === a.length - 1 ? .3 : 1; });
        });
        $('[data-reset]', el).addEventListener('click', () => { DataService.saveConfig({ dashLayout: [] }); api.close(); renderDashBody(); toast('Layout do Dashboard restaurado.'); });
        $('[data-ok]', el).addEventListener('click', () => {
          const novo = $$('[data-row]', list).map(r => ({ id: r.dataset.row, span: +$('[data-span]', r).value, h: Math.max(140, +$('[data-h]', r).value || 300), hidden: !$('[data-vis]', r).checked }));
          Dash.save(novo); api.close(); renderDashBody(); toast('Dashboard atualizado.');
        });
      }
    });
  }
};

const DashCharts = {
  donut(items, centro, sub) {
    const tot = items.reduce((a, x) => a + x.v, 0) || 1, R = 42, C = 2 * Math.PI * R;
    let off = 0;
    const arcs = items.map((x, i) => { const len = x.v / tot * C; const a = `<circle class="donut-seg" style="--d:${150 + i * 90}ms" cx="60" cy="60" r="${R}" fill="none" stroke="${x.cor}" stroke-width="18" stroke-dasharray="${Math.max(0, len - 0.8)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${U.esc(x.l)}: ${U.brl(x.v)} (${(x.v / tot * 100).toFixed(1)}%)</title></circle>`; off += len; return a; }).join('');
    return `<div class="flex-1 min-h-0 flex flex-wrap items-center justify-center gap-x-5 gap-y-3 overflow-auto scroll-thin">
      <svg viewBox="0 0 120 120" class="shrink-0 donut-svg" style="width:min(200px, 100%);max-height:100%;aspect-ratio:1">
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--soft)" stroke-width="18"/>${arcs}
        <text x="60" y="58" text-anchor="middle" style="font: 700 11px var(--font-head); fill: var(--ink-head)">${centro}</text>
        <text x="60" y="71" text-anchor="middle" style="font: 500 6.5px var(--font-body); fill: #94a3b8">${sub}</text>
      </svg>
      <div class="flex-1 min-w-[150px] space-y-1.5">${items.map(x => `<div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${x.cor}"></span><span class="flex-1 truncate text-slate-600" title="${U.esc(x.l)}">${U.esc(x.l)}</span><span class="tnum font-semibold text-slate-800">${(x.v / tot * 100).toFixed(0)}%</span><span class="tnum text-slate-400 w-[74px] text-right">${U.brl(x.v)}</span></div>`).join('')}</div>
    </div>`;
  },
  top(map, n, cores) {
    const arr = Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    const top = arr.slice(0, n).map(([l, v], i) => ({ l, v, cor: cores[i % cores.length] }));
    const rest = arr.slice(n).reduce((a, [, v]) => a + v, 0);
    if (rest > 0) top.push({ l: `Outros (${arr.length - n})`, v: rest, cor: '#cbd5e1' });
    return top;
  },
  line(series, max, labels, fmt = U.brl) {
    max = max || 1;
    const pts = vals => vals.map((v, i) => v == null ? null : [i / 11 * 100, 100 - v / max * 100]);
    const path = vals => pts(vals).filter(Boolean).map(([x, y]) => `${x},${y}`).join(' ');
    return `<div class="flex-1 min-h-[100px] relative mt-2 mb-1 mx-2">
        ${[0, 0.5, 1].map(f => `<div class="absolute left-0 right-0 border-t border-dashed border-slate-100" style="top:${f * 100}%"></div>`).join('')}
        <span class="absolute -top-3 left-0 text-[10px] text-slate-400 tnum">${fmt(max)}</span>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="absolute inset-0 w-full h-full overflow-visible line-svg">
          ${series.map(sr => `${sr.area ? `<polygon points="0,100 ${path(sr.vals)} ${pts(sr.vals).filter(Boolean).slice(-1)[0][0]},100" fill="${sr.cor}" opacity=".12"/>` : ''}<polyline points="${path(sr.vals)}" fill="none" stroke="${sr.cor}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" ${sr.dash ? 'stroke-dasharray="5 4"' : ''}/>`).join('')}
        </svg>
        ${series.map(sr => pts(sr.vals).map((p, i) => p ? `<span class="line-dot absolute w-2 h-2 -ml-1 -mb-1 rounded-full border-2 border-white" style="--d:${200 + i * 90}ms;left:${p[0]}%;bottom:${100 - p[1]}%;background:${sr.cor}" title="${U.esc(sr.nome)} · ${MESES[i]}: ${fmt(sr.vals[i])}"></span>` : '').join('')).join('')}
      </div>
      <div class="flex justify-between text-[10px] font-semibold text-slate-400 mx-1">${labels.map(l => `<span class="w-0 flex justify-center">${l}</span>`).join('')}</div>`;
  },
  head(t, sub, right = '') { return `<div class="flex flex-wrap items-start justify-between gap-2 mb-3"><div><h2 class="h2">${t}</h2>${sub ? `<p class="text-xs text-slate-500 mt-0.5">${sub}</p>` : ''}</div>${right}</div>`; },
  legend(items) { return `<div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-600">${items.map(([c, t]) => `<span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm" style="background:${c}"></span>${t}</span>`).join('')}</div>`; },
  build({ d, m, range, ano, ant, pendGeralItens }) {
    const cores = Theme.current().dist, H = DashCharts.head, out = {};
    const L = DataService.lancamentos();
    // Pizza por parceiro
    const pm = d.pizza || 'prod';
    const baseP = pm === 'rec' ? m.recebidos : pm === 'aberto' ? pendGeralItens : m.entregues;
    const byP = {}; baseP.forEach(l => { const n = nomeParceiroAtual(l); byP[n] = (byP[n] || 0) + l.valorTotal; });
    const itP = DashCharts.top(byP, 7, cores), totP = U.sum(itP, x => x.v);
    out.pizzaParc = `<div class="card p-5">${H('Participação por parceiro', pm === 'aberto' ? 'Em aberto agora (todas as datas)' : (pm === 'rec' ? 'Recebido no período' : 'Produzido no período'),
      `<div class="seg">${[['prod', 'Produzido'], ['rec', 'Recebido'], ['aberto', 'Em aberto']].map(([k, l]) => `<button class="${pm === k ? 'active' : ''}" data-action="dash-pizza" data-v="${k}">${l}</button>`).join('')}</div>`)}
      ${itP.length ? DashCharts.donut(itP, U.brl(totP).replace(',00', ''), `${Object.keys(byP).length} parceiros`) : emptyState('Sem dados no período', 'Escolha outro período.')}</div>`;
    // Pizza por categoria
    const byC = {}; m.entregues.forEach(l => { const c = l.categoria || 'Outros'; byC[c] = (byC[c] || 0) + l.valorTotal; });
    const itC = DashCharts.top(byC, 6, [...cores].reverse());
    out.pizzaCat = `<div class="card p-5">${H('Por categoria de serviço', 'Produzido no período')}${itC.length ? DashCharts.donut(itC, U.brl(U.sum(itC, x => x.v)).replace(',00', ''), `${m.qtd} artes`) : emptyState('Sem dados no período', 'Escolha outro período.')}</div>`;
    // Idade das pendências
    const faixas = [[0, 15, '0–15 dias', '#10b981'], [16, 30, '16–30 dias', '#84cc16'], [31, 60, '31–60 dias', '#f59e0b'], [61, 90, '61–90 dias', '#f97316'], [91, 1e9, 'Mais de 90 dias', '#ef4444']]
      .map(([a, b, l, c]) => { const it = pendGeralItens.filter(x => { const dd = U.daysSince(x.dataEntrega); return dd >= a && dd <= b; }); return { l, c, n: it.length, v: U.sum(it, x => x.valorTotal) }; });
    const maxF = Math.max(1, ...faixas.map(f => f.v));
    out.aging = `<div class="card p-5">${H('Idade das pendências', `${pendGeralItens.length} artes em aberto · ${U.brl(U.sum(pendGeralItens, x => x.valorTotal))}`)}
      <div class="flex-1 flex flex-col justify-around gap-3 min-h-0">${faixas.map(f => `<div>
        <div class="flex justify-between text-xs mb-1"><span class="font-semibold text-slate-600">${f.l}</span><span class="tnum text-slate-500"><b class="text-slate-800">${U.brl(f.v)}</b> · ${f.n}</span></div>
        <div class="bar-track !h-3"><div style="width:${f.v / maxF * 100}%;background:${f.c}"></div></div></div>`).join('')}</div></div>`;
    // Séries mensais
    const serie = y => Array.from({ length: 12 }, (_, i) => { const ym = `${y}-${String(i + 1).padStart(2, '0')}`; return { ym, ...resumoPeriodo([ym + '-01', U.lastDay(ym)]) }; });
    const A = serie(ano), B = serie(ant);
    const hojeYm = U.today().slice(0, 7), corte = ano === +hojeYm.slice(0, 4) ? +hojeYm.slice(5) : 12;
    const acum = (arr, k, n) => { let s = 0; return arr.map((x, i) => i < n ? (s += x[k]) : null); };
    const cA = acum(A, 'produzido', corte), cB = acum(B, 'produzido', 12);
    const temB = B.some(x => x.produzido);
    out.acum = `<div class="card p-5">${H('Faturamento acumulado', `Produzido somado mês a mês${temB ? ` · ${ano} × ${ant}` : ''}`)}
      ${DashCharts.legend([['var(--accent)', `${ano}: <b class="tnum">${U.brl(cA.filter(v => v != null).slice(-1)[0] || 0)}</b>`]].concat(temB ? [['var(--soft-2)', `${ant}: <b class="tnum">${U.brl(cB[11])}</b>`]] : []))}
      ${DashCharts.line([...(temB ? [{ nome: String(ant), vals: cB, cor: 'var(--soft-2)', dash: true }] : []), { nome: String(ano), vals: cA, cor: 'var(--accent)', area: true }], Math.max(...cA.filter(v => v != null), ...(temB ? cB : [0])), MESES_CURTOS)}</div>`;
    // Recebido x Despesas
    const maxC = Math.max(1, ...A.map(x => Math.max(x.recebido, x.despesas)));
    out.caixa = `<div class="card p-5">${H(`Recebido × Despesas · ${ano}`, `Lucro no ano: <b class="tnum text-slate-700">${U.brl(U.sum(A, x => x.lucro))}</b>`)}
      ${DashCharts.legend([['var(--chart-rec)', 'Recebido'], ['#f87171', 'Despesas']])}
      <div class="flex-1 min-h-[100px] flex items-end gap-1.5 mt-3 border-b" style="border-color:var(--line)">${A.map((x, i) => `<div class="flex-1 h-full flex items-end justify-center gap-[2px]" title="${MESES[i]}: recebido ${U.brl(x.recebido)} · despesas ${U.brl(x.despesas)} · lucro ${U.brl(x.lucro)}">
        <span class="grow-y w-[40%] max-w-[16px] rounded-t" style="--d:${i * 45}ms;height:${x.recebido / maxC * 100}%;background:var(--chart-rec);min-height:${x.recebido ? 2 : 0}px"></span>
        <span class="grow-y w-[40%] max-w-[16px] rounded-t" style="--d:${i * 45 + 20}ms;height:${x.despesas / maxC * 100}%;background:#f87171;min-height:${x.despesas ? 2 : 0}px"></span></div>`).join('')}</div>
      <div class="flex gap-1.5 mt-1.5">${MESES_CURTOS.map(l => `<span class="flex-1 text-center text-[10px] font-semibold text-slate-400">${l}</span>`).join('')}</div></div>`;
    // Ticket médio
    const tA = A.map((x, i) => i < corte && x.ticket ? x.ticket : null), tB = B.map(x => x.ticket || null);
    out.ticket = `<div class="card p-5">${H('Ticket médio por lançamento', `Média ${ano}: <b class="tnum text-slate-700">${U.brl(resumoPeriodo([ano + '-01-01', ano + '-12-31']).ticket)}</b>${temB ? ` · ${ant}: ${U.brl(resumoPeriodo([ant + '-01-01', ant + '-12-31']).ticket)}` : ''}`)}
      ${DashCharts.legend([['var(--accent)', String(ano)]].concat(temB ? [['var(--soft-2)', String(ant)]] : []))}
      ${DashCharts.line([...(temB ? [{ nome: String(ant), vals: tB, cor: 'var(--soft-2)', dash: true }] : []), { nome: String(ano), vals: tA, cor: 'var(--accent)' }], Math.max(...tA.filter(Boolean), ...tB.filter(Boolean), 1), MESES_CURTOS)}</div>`;
    // Produção por etapa (agora)
    const andamento = L.filter(l => etapaDe(l) !== 'entregue');
    const etItems = ETAPAS.filter(e => e.id !== 'entregue').map(e => { const it = andamento.filter(l => etapaDe(l) === e.id); return { e, n: it.length, v: U.sum(it, l => l.valorTotal) }; });
    const maxE = Math.max(1, ...etItems.map(x => x.n));
    out.etapas = `<div class="card p-5">${H('Produção em andamento', `${andamento.length} ${U.plural(andamento.length, 'arte', 'artes')} · ${U.brl(U.sum(andamento, l => l.valorTotal))}`, `<button class="btn btn-ghost btn-sm" data-action="dash-quadro">${icon('kanban', 'w-3.5 h-3.5')} Quadro</button>`)}
      <div class="flex-1 flex items-end gap-4 min-h-[90px] px-2">${etItems.map(x => `<div class="flex-1 h-full flex flex-col justify-end items-center gap-1.5">
        <span class="text-sm font-bold tnum" style="color:var(--ink-head)">${x.n}</span>
        <div class="grow-y w-full max-w-[90px] rounded-t-lg" style="height:${x.n / maxE * 75}%;min-height:${x.n ? 6 : 2}px;background:${x.e.cor}"></div>
        <span class="text-xs font-semibold text-slate-600">${x.e.nome}</span><span class="text-[10px] text-slate-400 tnum">${U.brl(x.v)}</span></div>`).join('')}</div></div>`;
    return out;
  }
};


/* =====================================================================
   ANIMAÇÕES — entrada de cards, gráficos e contadores
   ===================================================================== */
const Anim = {
  on() { return DataService.config().animacoes !== false && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); },
  io: null,
  sel: '#dashBody > .grid > .card, .dash-w > .card, #relBody > div > .card, #relBody > .card, #relBody > .grid > .card, #parcBody .card, #despBody > .grid > .card, #despBody > .grid > div > .card, #orcBody > .grid > .card, .tabbar ~ #cadBody .card.p-3',
  apply() { document.documentElement.setAttribute('data-anim', Anim.on() ? 'on' : 'off'); },
  scan(root = document) {
    if (!Anim.on()) return;
    if (!Anim.io) Anim.io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { Anim.show(en.target); Anim.io.unobserve(en.target); } }), { threshold: 0.08 });
    let n = 0;

      if (el.dataset.anim) return; el.dataset.anim = '1';

      $$('.col-bar', el).forEach((b, i) => { if (!b.style.getPropertyValue('--d')) b.style.setProperty('--d', `${120 + Math.floor(i / 2) * 45 + (i % 2) * 25}ms`); });

  },
  show(el) {
    el.classList.add('anim-in');

  },
  count(el) {
    if (el.dataset.counted) return; el.dataset.counted = '1';
    const alvo = Number(el.dataset.count); if (!isFinite(alvo) || alvo === 0 || (U.privado && el.dataset.fmt === 'brl')) return;

    const escolha = await escolher('Os dados mudaram em outro aparelho', `A nuvem tem uma versão salva ${quando ? 'em <b>' + quando + '</b>' : 'mais recente'} e este aparelho também tem alterações. Qual versão você quer manter?`, 'Usar a da nuvem', 'Manter a deste aparelho');
    if (escolha === 'a') { aplicar(r); setStatus('ok'); render(); toast('Dados atualizados com a versão da nuvem.'); }
    else { setMeta({ userId: uid(), versao: r.versao }); await enviar(r.versao); toast('A versão deste aparelho foi salva na nuvem.'); }
  }
  function escolher(titulo, msg, a, b) {
    return new Promise(res => {
      let r = 'a';
      Modal.open({ title: titulo, size: 'sm', body: `<p class="text-sm text-slate-600">${msg}</p>`,
        footer: `<button class="btn btn-ghost" data-b>${b}</button><button class="btn btn-primary" data-a>${a}</button>`,
        onMount(el, api) { $('[data-a]', el).addEventListener('click', () => { r = 'a'; api.close(); }); $('[data-b]', el).addEventListener('click', () => { r = 'b'; api.close(); }); },
        onClose() { res(r); } });
    });
  }
  /* primeira sincronização depois do login (ou ao abrir com sessão salva) */
  async function sincronizarInicial() {
    setStatus('salvando');
    let r;
    try { r = await remoto(); }
    catch (e) { if (e.offline) { setStatus('offline', 'Sem internet: usando a cópia deste aparelho.'); return; } setStatus('erro', traduz(e.message)); toast(traduz(e.message), 'error'); return; }
    const m = meta(), mesmo = m.userId === uid();
    if (!r) { setMeta({ userId: uid(), versao: 0 }); await enviar(); if (status === 'ok') toast('Seus dados foram enviados para a nuvem.'); return; }
    if (mesmo && !m.sujo) { if (r.versao !== m.versao) aplicar(r); setStatus('ok'); return; }
    if (mesmo && m.sujo) { if (r.versao === m.versao) return enviar(); setStatus('conflito'); return resolverConflito(); }
    if (localNovo) { aplicar(r); setStatus('ok'); return; }
    const e = await escolher('Já existem dados na nuvem', 'Esta conta já tem dados salvos na nuvem e este navegador também tem dados. Qual você quer usar?', 'Usar os da nuvem', 'Enviar os deste navegador');
    if (e === 'a') { aplicar(r); setStatus('ok'); }
    else { setMeta({ userId: uid(), versao: r.versao }); await enviar(r.versao); }
  }
  async function verificarAtualizacao() {
    if (!ativa() || !uid() || meta().sujo || enviando || $('#login')) return;
    try { const r = await remoto(true); if (r && r.versao !== meta().versao) { const full = await remoto(); if (full) { aplicar(full); render(); toast('Atualizado com alterações feitas em outro aparelho.', 'info'); } } setStatus('ok'); }
    catch (e) { if (e.offline) setStatus('offline', 'Sem internet.'); }
  }
  function vigiar() {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verificarAtualizacao(); else if (meta().sujo) enviar(); });
    window.addEventListener('online', () => { if (meta().sujo) enviar(); else verificarAtualizacao(); });
    setInterval(() => { if (meta().sujo && status !== 'salvando' && status !== 'conflito') enviar(); }, 30000);
  }
  async function testar(url, chave) {
    const r = await fetch(url.replace(/\/+$/, '') + '/auth/v1/settings', { headers: /^eyJ/.test(chave) ? { apikey: chave, Authorization: 'Bearer ' + chave } : { apikey: chave } });
    if (!r.ok) throw new Error(r.status === 401 ? 'Chave inválida.' : 'Não foi possível conectar (' + r.status + ').');
    return true;
  }
  return {
    ativa, cfg, salvarCfg: c => ls.set(CFG, c), limparCfg: () => ls.del(CFG), padraoFixo: () => !!(NUVEM_PADRAO.url && NUVEM_PADRAO.chave),
    login, sair, temSessao, recuperar, trocarSenha, lerRetorno, carregarUsuario, loginGoogle, provedores, erroRetorno: () => erroRetorno, usuario, traduz, testar,
    sincronizarInicial, agendar, enviar, verificarAtualizacao, vigiar, meta,
    status: () => status, statusMsg: () => statusMsg, ouvir: f => ouvintes.push(f),
    set localNovo(v) { localNovo = v; }
  };
})();

const Auth = {
  KEY: 'mrdesign_auth_v1', KEEP_G: 'mrdesign_google',
  avisar(msg) { setTimeout(() => { const e = $('#lgErr'); if (e && msg) { e.style.color = '#dc2626'; e.textContent = msg; } }, 700); }, KEEP: 'mrdesign_keep_v1', SESS: 'mrdesign_sess_v1',
  get() { try { return JSON.parse(localStorage.getItem(Auth.KEY) || 'null'); } catch (e) { return null; } },
  set(a) { try { localStorage.setItem(Auth.KEY, JSON.stringify(a)); } catch (e) { /* */ } },
  configurado() { if (Nuvem.ativa()) return true; const a = Auth.get(); return !!(a && a.hash); },
  ativo() { if (Nuvem.ativa()) return true; const a = Auth.get(); return !a || a.ativo !== false; },
  async hash(salt, senha) {
    const txt = salt + '|' + senha;
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 2166136261; for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16); }
  },
  token(a) { return (a.hash || '').slice(0, 24); },
  sessaoValida() {
    const a = Auth.get(); if (!a || !a.hash) return false;
    try { if (sessionStorage.getItem(Auth.SESS) === Auth.token(a)) return true; } catch (e) { /* */ }
    try { const k = JSON.parse(localStorage.getItem(Auth.KEEP) || 'null'); if (k && k.t === Auth.token(a) && k.exp > Date.now()) { sessionStorage.setItem(Auth.SESS, k.t); return true; } } catch (e) { /* */ }
    return false;
  },
  abrirSessao(manter) {
    const a = Auth.get(), t = Auth.token(a);
    try { sessionStorage.setItem(Auth.SESS, t); } catch (e) { /* */ }
    try { if (manter) localStorage.setItem(Auth.KEEP, JSON.stringify({ t, exp: Date.now() + 30 * 864e5 })); else localStorage.removeItem(Auth.KEEP); } catch (e) { /* */ }
    Auth.ultimo = Date.now();

  },

      <div class="lg-art">
        <div class="lg-flor f1">${fl('')}</div><div class="lg-flor f2">${fl('')}</div><div class="lg-flor f3">${fl('')}</div><div class="lg-flor f4">${fl('')}</div><div class="lg-flor f5">${fl('')}</div>
        <div class="lg-m">${idSvg('m', 'w-full h-auto', { '*': 'currentColor' })}</div>
        <div><div class="lg-logo">${logoSvg('w-full h-auto', 'currentColor', T.logoFlor || B27.malva)}</div><div class="lg-tag mt-3">Produção & Financeiro</div></div>
        <div class="lg-pen" style="color:var(--lg-flor)">${idSvg('pen', 'w-full h-auto', { '*': 'currentColor' })}</div><div></div>
      </div>
      <div class="lg-side">${forms[NV && modo === 'esqueci' ? 'esqueciNv' : (NV && modo === 'criar' ? 'login' : modo)]}<div class="lg-foot">${U.esc(DataService.emissor().nome || 'MR Design')} · ${NV ? 'conectado à nuvem' : `acesso protegido neste navegador · <a class="lg-link" data-lg="nuvem">conectar à nuvem</a>`}</div></div>`;
    if (NV && modo === 'criar') modo = 'login';
    const f = $('form', el), err = $('#lgErr', el), b = $('.lg-btn', el);
    const erro = msg => { err.textContent = msg; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); b.classList.remove('loading'); };
    $$('[data-eye]', el).forEach(x => x.addEventListener('click', () => { const i = $('#' + x.dataset.eye, el); i.type = i.type === 'password' ? 'text' : 'password'; x.innerHTML = icon(i.type === 'password' ? 'eye' : 'eyeOff', 'w-[18px] h-[18px]'); i.focus(); }));
    $$('[data-lg]', el).forEach(x => x.addEventListener('click', () => Auth.mostrar(onOk, x.dataset.lg)));
    if (NV && modo === 'login') {
      Nuvem.provedores().then(pv => { const bx = $('#lgGoogleBox', el); if (bx && pv.google) bx.classList.remove('hidden'); });
      const g = $('#lgGoogle', el); if (g) g.addEventListener('click', () => { g.classList.add('loading'); try { localStorage.setItem(Auth.KEEP_G, '1'); } catch (e) { /* */ } Nuvem.loginGoogle(); });
    }
    $$('input', el).forEach(i => i.addEventListener('input', () => { err.textContent = ''; }));
    setTimeout(() => { const first = modo === 'login' && $('#lgUser', el).value ? $('#lgPass', el) : $('input', f); try { first.focus({ preventScroll: true }); } catch (e) { /* */ } }, 600);
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); if (b.classList.contains('loading')) return;
      const v = id => ($('#' + id, el) || {}).value || '';
      b.classList.add('loading'); err.textContent = '';
      await new Promise(r => setTimeout(r, 450));
      if (modo === 'nuvem') {
        const url = v('lgUrl').trim(), chave = v('lgKey').trim();
        if (!/^https:\/\/.+/.test(url) || !chave) return erro('Informe a URL (https://...) e a chave pública.');
        try { await Nuvem.testar(url, chave); } catch (e) { return erro(e.message || 'Não foi possível conectar.'); }
        Nuvem.salvarCfg({ url, chave }); location.reload(); return;
      }
      if (NV) {
        try {
          if (modo === 'login') {
            if (!v('lgUser') || !v('lgPass')) return erro('Preencha e-mail e senha.');
            await Nuvem.login(v('lgUser'), v('lgPass'), ($('#lgKeep', el) || {}).checked);
            try { localStorage.setItem('mrdesign_nuvem_email', v('lgUser').trim()); } catch (e) { /* */ }
          } else if (modo === 'esqueci') {
            if (!v('lgDoc')) return erro('Informe o e-mail.');
            await Nuvem.recuperar(v('lgDoc'));
            b.classList.remove('loading'); err.style.color = '#059669'; err.textContent = 'Pronto! Confira seu e-mail e abra o link para criar a nova senha.'; return;
          } else if (modo === 'novasenha') {
            if (v('lgPass').length < 6) return erro('A senha precisa ter pelo menos 6 caracteres.');
            if (v('lgPass') !== v('lgPass2')) return erro('As senhas não conferem.');
            await Nuvem.trocarSenha(v('lgPass'));
            await Nuvem.carregarUsuario();
          }
          await Nuvem.sincronizarInicial();
        } catch (e) { if (modo === 'login') $('#lgPass', el).value = ''; return erro(e.offline ? 'Sem conexão com a internet.' : Nuvem.traduz(e.message)); }
        b.classList.remove('loading'); b.classList.add('ok'); Auth.ultimo = Date.now();
        return Auth.entrar(b, onOk);
      }
      if (modo === 'login') {
        if (!v('lgUser') || !v('lgPass')) return erro('Preencha usuário e senha.');
        if (!(await Auth.confere(v('lgUser'), v('lgPass')))) { $('#lgPass', el).value = ''; return erro('Usuário ou senha incorretos.'); }
      } else if (modo === 'criar') {
        if (!v('lgUser').trim()) return erro('Escolha um usuário.');
        if (v('lgPass').length < 4) return erro('A senha precisa de pelo menos 4 caracteres.');
        if (v('lgPass') !== v('lgPass2')) return erro('As senhas não conferem.');
        await Auth.criar({ nome: v('lgNome').trim(), usuario: v('lgUser'), senha: v('lgPass'), dica: v('lgDica').trim() });
      } else {
        const doc = (DataService.emissor().documento || '').replace(/\D/g, '');
        const ok = doc ? v('lgDoc').replace(/\D/g, '') === doc : v('lgDoc').trim().toUpperCase() === 'REDEFINIR';
        if (!ok) return erro(doc ? 'O documento não confere com o cadastrado.' : 'Digite REDEFINIR para continuar.');
        return Auth.mostrar(onOk, 'criar');
      }
      Auth.abrirSessao(($('#lgKeep', el) || {}).checked);
      b.classList.remove('loading'); b.classList.add('ok');
      Auth.entrar(b, onOk);
    });
  },
  entrar(origem, onOk) {
    const el = $('#login'), r = origem.getBoundingClientRect();
    const burst = document.createElement('div'); burst.className = 'lg-burst';
    burst.style.left = (r.left + r.width / 2) + 'px'; burst.style.top = (r.top + r.height / 2) + 'px';
    setTimeout(() => {
      document.body.appendChild(burst);
      setTimeout(() => {
        el.remove(); document.body.style.overflow = '';
        onOk && onOk();
        burst.classList.add('fade'); setTimeout(() => burst.remove(), 1500);
      }, 750);
    }, 380);
  },
  async bloquear() {
    if (Nuvem.ativa() && Nuvem.meta().sujo) { try { await Nuvem.enviar(); } catch (e) { /* */ } }
    Auth.sair(); $('#app').innerHTML = ''; if (DataService.integ().painel.aberto) { /* painel some atrás da tela */ }
    Auth.mostrar(() => { render(); Panel.render(); });
  },
  /* bloqueio automático por inatividade */
  ultimo: Date.now(),
  vigiar() {
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(e => document.addEventListener(e, () => { Auth.ultimo = Date.now(); }, { passive: true }));
    setInterval(() => {
      const a = Auth.get(), min = a && +a.autoLock;
      if (!min || !Auth.ativo() || !Auth.configurado() || $('#login')) return;
      if (Date.now() - Auth.ultimo > min * 60000) Auth.bloquear();
    }, 20000);
  }
};

function cadAcesso() {
  if (Nuvem.ativa()) { $('#cadBody').innerHTML = '<div class="grid lg:grid-cols-2 gap-6" id="nvBox"></div>'; cadNuvem($('#nvBox')); return; }
  const a = Auth.get() || {};
  $('#cadBody').innerHTML = `
    <div class="grid lg:grid-cols-2 gap-6">
      <div class="card p-6">
        <h2 class="h2 mb-1">Tela de login</h2>
        <p class="text-sm text-slate-500 mb-5">Protege o sistema neste navegador. Quando o sistema for para a nuvem, este acesso vira o login online.</p>
        <div class="flex items-center gap-3 p-3 rounded-xl mb-4" style="background:var(--soft)">
          <span class="w-10 h-10 rounded-xl grid place-items-center text-white" style="background:var(--accent)">${icon('user', 'w-5 h-5')}</span>
          <div class="min-w-0"><div class="font-semibold text-slate-800">${U.esc(a.nome || '—')}</div><div class="text-xs text-slate-500">usuário: <b>${U.esc(a.usuario || '—')}</b>${a.criadoEm ? ' · senha definida em ' + U.date(a.criadoEm.slice(0, 10)) : ''}</div></div>
        </div>
        <label class="flex items-center justify-between gap-3 py-3 border-t" style="border-color:var(--line)"><span><span class="font-semibold text-slate-800 text-sm">Pedir login ao abrir</span><span class="block text-xs text-slate-500">Desligado, o sistema abre direto.</span></span><input type="checkbox" class="chk" id="acAtivo" ${Auth.ativo() ? 'checked' : ''}></label>
        <label class="flex items-center justify-between gap-3 py-3 border-t" style="border-color:var(--line)"><span><span class="font-semibold text-slate-800 text-sm">Bloquear sem uso</span><span class="block text-xs text-slate-500">Volta para o login depois de um tempo parado.</span></span>
          <select class="input !w-auto" id="acLock">${[[0, 'Nunca'], [15, '15 min'], [30, '30 min'], [60, '1 hora']].map(([v, l]) => `<option value="${v}" ${(+a.autoLock || 0) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <button class="btn btn-ghost mt-3" data-action="lock">${icon('lock')} Bloquear agora</button>
      </div>
      <div class="card p-6">
        <h2 class="h2 mb-1">Trocar senha</h2>
        <p class="text-sm text-slate-500 mb-5">Confirme a senha atual para definir a nova.</p>
        <div class="space-y-3">
          <div><label class="label">Senha atual</label><input type="password" class="input" id="acAtual" autocomplete="current-password"></div>
          <div><label class="label">Usuário</label><input class="input" id="acUser" value="${U.esc(a.usuario || '')}"></div>
          <div class="grid sm:grid-cols-2 gap-3"><div><label class="label">Nova senha</label><input type="password" class="input" id="acNova" autocomplete="new-password"></div><div><label class="label">Confirmar</label><input type="password" class="input" id="acNova2" autocomplete="new-password"></div></div>
          <div><label class="label">Dica (opcional)</label><input class="input" id="acDica" value="${U.esc(a.dica || '')}"></div>
          <button class="btn btn-primary" id="acSalvar">${icon('check')} Salvar nova senha</button>
        </div>
      </div>
    </div>
    <div class="grid lg:grid-cols-2 gap-6 mt-6" id="nvBox"></div>`;
  cadNuvem($('#nvBox'));
  $('#acAtivo').addEventListener('change', e => { Auth.set({ ...Auth.get(), ativo: e.target.checked }); toast(e.target.checked ? 'O login será pedido ao abrir.' : 'O sistema vai abrir sem login.', 'info'); });
  $('#acLock').addEventListener('change', e => { Auth.set({ ...Auth.get(), autoLock: +e.target.value }); toast('Bloqueio automático atualizado.'); });
  $('#acSalvar').addEventListener('click', async () => {
    const g = id => $('#' + id).value;
    if (!(await Auth.confere(a.usuario, g('acAtual')))) { toast('Senha atual incorreta.', 'error'); return; }
    if (!g('acUser').trim()) { toast('Informe o usuário.', 'error'); return; }
    if (g('acNova').length < 4) { toast('A nova senha precisa de pelo menos 4 caracteres.', 'error'); return; }
    if (g('acNova') !== g('acNova2')) { toast('As senhas não conferem.', 'error'); return; }
    await Auth.criar({ nome: a.nome, usuario: g('acUser'), senha: g('acNova'), dica: g('acDica').trim() });
    Auth.abrirSessao(true); cadAcesso(); toast('Senha alterada.');
  });
}


/* =====================================================================
   APP INSTALÁVEL (PWA)
   ===================================================================== */
const PWA = {
  evento: null,
  instalado() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; },
  ios() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  disponivel() { return !PWA.instalado() && (window.isSecureContext && location.protocol !== 'file:') && (!!PWA.evento || PWA.ios()); },
  iniciar() {
    if (PWA.instalado()) document.documentElement.classList.add('modo-app');
    if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.evento = e; try { renderTopbar(); } catch (x) { /* */ } });
    window.addEventListener('appinstalled', () => { PWA.evento = null; try { renderTopbar(); } catch (x) { /* */ } toast('App instalado! Ele já está na sua tela inicial.'); });
  },
  async instalar() {
    if (PWA.evento) { PWA.evento.prompt(); const r = await PWA.evento.userChoice.catch(() => ({})); PWA.evento = null; renderTopbar(); if (r && r.outcome === 'accepted') toast('Instalando o app…'); return; }
    const passo = (n, t) => `<div class="flex gap-3 items-start"><span class="w-7 h-7 rounded-full grid place-items-center text-white text-sm font-bold shrink-0" style="background:var(--accent)">${n}</span><p class="text-sm text-slate-600 pt-1">${t}</p></div>`;
    Modal.open({ title: 'Instalar o app', size: 'sm', body: PWA.ios()
      ? `<div class="space-y-3">${passo(1, 'Abra este endereço no <b>Safari</b>.')}${passo(2, 'Toque em <b>Compartilhar</b> (o quadrado com a seta para cima).')}${passo(3, 'Escolha <b>Adicionar à Tela de Início</b> e toque em <b>Adicionar</b>.')}</div><p class="text-xs text-slate-500 mt-4">O ícone da MR aparece junto dos outros apps e abre em tela cheia.</p>`
      : `<div class="space-y-3">${passo(1, 'No Chrome ou Edge, abra o menu <b>⋮</b> do navegador.')}${passo(2, 'Toque em <b>Instalar app</b> (ou "Adicionar à tela inicial").')}</div>`,
      footer: '<button class="btn btn-primary" data-close>Entendi</button>' });
  }
};
PWA.iniciar();

(function init() {
  const res = DataService.load();
  if (!res.storageOk) {
    $('#storageWarning').innerHTML = `<div class="bg-red-600 text-white text-sm px-4 py-2 text-center">O navegador bloqueou o armazenamento local: os dados <b>não serão salvos</b> ao fechar. Abra o sistema em uma aba normal (fora do modo anônimo) ou exporte backups.</div>`;
  }
  const v = location.hash.slice(1);
  State.view = VIEWS.some(x => x.id === v) ? v : 'dashboard';
  U.privado = !!DataService.config().privado;
  try { seedContratos(); } catch (e) { console.error(e); }
  Nuvem.localNovo = !!res.seeded;
  const trTok = /^#token=([A-Za-z0-9]+)/.exec(location.hash);
  if (trTok) { try { sessionStorage.setItem('mrdesign_trello_novo', trTok[1]); } catch (e) { /* */ } history.replaceState(null, '', location.pathname + location.search); }
  const iniciar = () => {
  let tn = null; try { tn = sessionStorage.getItem('mrdesign_trello_novo'); sessionStorage.removeItem('mrdesign_trello_novo'); } catch (e) { /* */ }
  if (tn) { DataService.saveInteg('trello', { token: tn }); Trello.cache = null; setTimeout(() => { toast('Trello conectado!', 'success', { label: 'Ver quadro', fn: () => Panel.open('trello') }); }, 900); }
  if (Agenda.cfg().clientId) Agenda.carregarGis().catch(() => {});
  LogoCor.todas();
  const ger = Recorrencias.run();
  render();
  Panel.render();
  if (ger.nRec + ger.nDesp) setTimeout(() => toast(`Novo mês: ${ger.nRec} contrato(s) e ${ger.nDesp} despesa(s) fixa(s) lançados automaticamente.`, 'info'), 900);
  if (res.seeded && !Nuvem.ativa()) { State.dash.modo = 'ano'; State.dash.ano = 2026; render(); setTimeout(() => toast('Bem-vindo! Sua planilha 2026 foi carregada. Complete seus dados de emissor e chave PIX em Cadastros.', 'info', { label: 'Completar dados', fn: () => { State.cad = 'emissor'; go('cadastros'); } }), 400); }
  };
  Auth.vigiar();
  if (Nuvem.ativa()) {
    DataService.onPersist(() => Nuvem.agendar()); Nuvem.vigiar();
    const ret = Nuvem.lerRetorno();
    if (ret === 'recovery') { Nuvem.carregarUsuario().catch(() => {}); Auth.mostrar(iniciar, 'novasenha'); }
    else if (ret === 'oauth') Nuvem.carregarUsuario().then(() => Nuvem.sincronizarInicial()).then(iniciar, e => { Auth.mostrar(iniciar); Auth.avisar(Nuvem.traduz(e && e.message)); });
    else if (ret === 'erro') { Auth.mostrar(iniciar); Auth.avisar(Nuvem.erroRetorno()); }
    else Nuvem.temSessao().then(ok => ok ? Nuvem.sincronizarInicial().then(iniciar, iniciar) : Auth.mostrar(iniciar));
  } else if (Auth.ativo() && !Auth.sessaoValida()) Auth.mostrar(iniciar); else iniciar();
})();
</script>
