    } else {
      font('normal', 8.3, MUTED);
      txt(`${qtdTotal} ${U.plural(qtdTotal, 'arte entregue', 'artes entregues')} no período`, M, y + 8);
      if (o.vencimento) { font('bold', 9, INK); txt('Pagamento até ' + U.date(o.vencimento), M, y + 14); }
      else if (p.condicao) { font('bold', 9, INK); txt('Condição: ' + p.condicao, M, y + 14); }
    }
    y += 30;

    if (!isRec) {
      /* Dados para pagamento */
      const rows = [
        e.pixChave && ['Chave PIX' + (e.pixTipo ? ' (' + e.pixTipo + ')' : ''), e.pixChave],
        e.titular && ['Titular', e.titular],
        e.banco && ['Banco', e.banco]
      ].filter(Boolean);
      if (rows.length) {
        const bh = 11 + rows.length * 6;
        ensure(bh + 4);
        doc.setFillColor(...SOFT); doc.roundedRect(M, y, W - 2 * M, bh, 2.5, 2.5, 'F');
        doc.setFillColor(...AC2); doc.rect(M, y, 1.4, bh, 'F');
        font('bold', 7, MUTED); txt('DADOS PARA PAGAMENTO', M + 6, y + 6.5);
        rows.forEach((r, i) => {
          font('normal', 8.5, MUTED); txt(r[0], M + 6, y + 13 + i * 6);
          font('bold', i === 0 ? 10.5 : 9, INK); txt(r[1], M + 52, y + 13 + i * 6);
        });
        y += bh + 6;
      }
    } else {
      /* Declaração de quitação */
      const decl = `Declaro, para os devidos fins, que recebi de ${p.nome}${p.documento ? ', inscrito(a) no CPF/CNPJ sob o nº ' + p.documento : ''}, a importância de ${U.brlPdf(total)} (${U.extenso(total)}), referente aos ${itens.length} ${U.plural(itens.length, 'serviço', 'serviços')} de criação e design listados neste documento, dando plena, geral e irrevogável quitação dos valores acima descritos.`;
      font('normal', 9.3, BODY);
      const lines = doc.splitTextToSize(decl, W - 2 * M);
      ensure(lines.length * 4.8 + 40);
      doc.text(lines, M, y, { lineHeightFactor: 1.5 });
      y += lines.length * 4.9 + 6;
      font('normal', 9, MUTED);
      txt(`${e.cidade ? e.cidade + ', ' : ''}${U.dateLong(o.emissao)}.`, M, y);
      y += 20;
      if (TP.id27) { const pn = Theme.png('pen', B27.rosaClaro); if (pn) { try { doc.addImage(pn, 'PNG', W / 2 + 22, y - 17, 18, 17); } catch (err) { /* */ } } }
      doc.setDrawColor(148, 163, 184); doc.setLineWidth(0.3); doc.line(W / 2 - 40, y, W / 2 + 40, y);
      font('bold', 9.5, INK); txt(e.nome || '', W / 2, y + 5, { align: 'center' });
      if (e.documento) { font('normal', 8, MUTED); txt('CPF/CNPJ: ' + e.documento, W / 2, y + 9.5, { align: 'center' }); }
      y += 16;
    }

    if (o.obs) {
      font('normal', 8.5, [51, 65, 85]);
      const ol = doc.splitTextToSize(o.obs, W - 2 * M - 10);
      ensure(ol.length * 4.4 + 12);
      font('bold', 7, MUTED); txt('OBSERVAÇÕES', M, y + 2);
      font('normal', 8.5, [51, 65, 85]); doc.text(ol, M, y + 7.5, { lineHeightFactor: 1.4 });
      y += ol.length * 4.4 + 10;
    }

    /* Marca d'água discreta no recibo */
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      if (isRec) {
        try {
          doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity: 0.05 }));
          font('bold', 110, GREEN); txt('PAGO', W / 2, H / 2 + 20, { align: 'center', angle: 30 });
          doc.restoreGraphicsState();
        } catch (err) { /* sem suporte a opacidade */ }
      }
      /* Marca d'água da identidade (cobrança e recibo) — escolhida em Emissor (PDF) */
      const MD = MARCAS_DAGUA[DataService.config().marcaDagua] || MARCAS_DAGUA.m;
      if (TP.brand && MD.kind) {
        const mw = Theme.png(MD.kind, TP.flor || B27.rosa);
        if (mw) {
          try {
            const A = ID27[MD.vb], ww = MD.w, hh = ww * A.vb[3] / A.vb[2];
            doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity: MD.op }));
            doc.addImage(mw, 'PNG', (W - ww) / 2, H - MD.base - hh, ww, hh);
            doc.restoreGraphicsState();
          } catch (err) { /* sem suporte a opacidade */ }
        }
      }
      /* Flor da marca no canto inferior */
      let fr = W - M;
      if (TP.brand) {
        const fl = Theme.png('flor', TP.flor || BRAND.rosa);
        if (fl) { try { doc.addImage(fl, 'PNG', W - 30, H - 30, 44, 44); fr = W - 34; } catch (err) { /* ignora */ } }
      }
      /* Rodapé */
      doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, H - 15, fr, H - 15);
      font('normal', 7.5, MUTED);
      if (e.rodape) txt(doc.splitTextToSize(e.rodape, fr - M - 40)[0], M, H - 10);
      txt(`${o.numero}  ·  Página ${i} de ${pages}`, fr, H - 10, { align: 'right' });
    }
    return doc;
  }
};

function whatsText(tipo, itens, parceiro) {
  const e = DataService.emissor();
  const list = [...itens].sort((a, b) => a.dataEntrega.localeCompare(b.dataEntrega));
  const total = U.sum(list, l => l.valorTotal);
  const linhas = list.map(l => `• ${U.dateShort(l.dataEntrega)} – ${l.servicoNome}: ${l.titulo}${l.qtd > 1 ? ` (${l.qtd}x)` : ''} — ${U.brlRaw(l.valorTotal)}`);
  const out = [];
  if (tipo === 'recibo') {
    out.push(`Olá, ${parceiro.nome}! Tudo bem?`, '', `Confirmo o recebimento de *${U.brlRaw(total)}* referente a ${list.length} ${U.plural(list.length, 'arte', 'artes')}:`, '', ...linhas, '', '✅ *Pagamento quitado.* O recibo em PDF segue em anexo.', 'Muito obrigado pela parceria!');
  } else {
    out.push(`Olá, ${parceiro.nome}! Tudo bem?`, '', `Segue o fechamento das artes entregues (${list.length} ${U.plural(list.length, 'item', 'itens')}):`, '', ...linhas, '', `*Total a pagar: ${U.brlRaw(total)}*`);
    if (e.pixChave) out.push('', `*Pix${e.pixTipo ? ' (' + e.pixTipo + ')' : ''}:* ${e.pixChave}` + (e.titular ? `\nTitular: ${e.titular}` : '') + (e.banco ? ` · ${e.banco}` : ''));
    out.push('', 'O demonstrativo detalhado em PDF segue em anexo. Obrigado!');
  }
  if (e.nome) out.push(`— ${e.nome}`);
  return out.join('\n');
}

function waLink(phone, text) {
  let d = U.digits(phone);
  if (!d) return null;
  if (d.length <= 11) d = '55' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}

async function copiarWhats(ids) {
  const items = ids.map(id => DataService.lancamento(id)).filter(Boolean);
  const pids = [...new Set(items.map(l => l.parceiroId))];
  if (pids.length !== 1) { toast('Selecione artes de um único parceiro.', 'error'); return; }
  const parceiro = DataService.parceiro(pids[0]) || { nome: items[0].parceiroNome };
  const pend = items.filter(l => l.statusPgto === 'pendente');
  const tipo = pend.length ? 'cobranca' : 'recibo';
  const ok = await U.copy(whatsText(tipo, tipo === 'cobranca' ? pend : items, parceiro));
  toast(ok ? `Resumo de ${tipo === 'cobranca' ? 'cobrança' : 'recibo'} copiado! Cole no WhatsApp.` : 'Não foi possível copiar automaticamente.', ok ? 'success' : 'error');
}

/* Modal de pré-visualização e emissão do PDF */
function openPdfModal(ids, tipoPref = null) {
  if (!PDFService.available()) { toast('A biblioteca de PDF não carregou. Verifique a conexão com a internet e recarregue a página.', 'error'); return; }
  const all = ids.map(id => DataService.lancamento(id)).filter(Boolean);
  const pids = [...new Set(all.map(l => l.parceiroId))];
  if (!all.length) return;
  if (pids.length !== 1) { toast('Selecione artes de um único parceiro para gerar o documento.', 'error'); return; }
  const parceiro = DataService.parceiro(pids[0]) || { nome: all[0].parceiroNome, documento: '', whatsapp: '', email: '', condicao: '' };
  const pend = all.filter(l => l.statusPgto === 'pendente'), pagos = all.filter(l => l.statusPgto === 'pago');
  let tipo = tipoPref || (pend.length ? 'cobranca' : 'recibo');
  if (tipo === 'cobranca' && !pend.length) tipo = 'recibo';
  if (tipo === 'recibo' && !pagos.length) tipo = 'cobranca';

  const st = { tipo, numero: DataService.proximoNumero(tipo), auto: true, emissao: U.today(), vencimento: '', obs: '' };
  const itensDo = t => t === 'recibo' ? pagos : pend;
  let url = null;

  const recebInfo = itens => {
    const datas = [...new Set(itens.map(l => l.dataPgto).filter(Boolean))].sort();
    const metodos = [...new Set(itens.map(l => l.metodoPgto).filter(Boolean))];
    return {
      dataRecebimentoTxt: !datas.length ? '-' : datas.length === 1 ? U.date(datas[0]) : `${U.date(datas[0])} a ${U.date(datas[datas.length - 1])}`,
      metodoTxt: metodos.join(', ')
    };
  };
  const opts = () => {
    const itens = itensDo(st.tipo);
    return { tipo: st.tipo, itens, parceiro, emissor: DataService.emissor(), numero: st.numero || '-', emissao: st.emissao || U.today(), vencimento: st.tipo === 'cobranca' ? st.vencimento : '', obs: st.obs, ...recebInfo(itens) };
  };
  const filename = () => {
    const itens = itensDo(st.tipo);
    const ref = (itens.map(l => l.dataEntrega).sort().pop() || U.today()).slice(0, 7);
    return `${st.tipo === 'recibo' ? 'Recibo' : 'Cobranca'}_${U.pascal(parceiro.nome)}_${ref}.pdf`;
  };

  const body = `
    <div class="grid lg:grid-cols-[340px_1fr] gap-5">
      <div class="space-y-4">
        <div>
          <label class="label">Modelo do documento</label>
          <div class="grid grid-cols-2 gap-2" id="pdfTipo">
            <button type="button" data-tipo="cobranca" class="rounded-xl border-2 p-3 text-left transition ${!pend.length ? 'opacity-40 pointer-events-none' : ''}">
              <span class="text-slate-700">${icon('file', 'w-5 h-5')}</span><div class="text-sm font-bold text-slate-800 mt-1.5">Cobrança</div><div class="text-[11px] text-slate-500">${pend.length} ${U.plural(pend.length, 'pendente', 'pendentes')}</div>
            </button>
            <button type="button" data-tipo="recibo" class="rounded-xl border-2 p-3 text-left transition ${!pagos.length ? 'opacity-40 pointer-events-none' : ''}">
              <span class="text-emerald-600">${icon('receipt', 'w-5 h-5')}</span><div class="text-sm font-bold text-slate-800 mt-1.5">Recibo</div><div class="text-[11px] text-slate-500">${pagos.length} ${U.plural(pagos.length, 'paga', 'pagas')}</div>
            </button>
          </div>
          ${pend.length && pagos.length ? `<p class="text-[11px] text-slate-500 mt-2">Sua seleção mistura artes pagas e pendentes: a cobrança lista só as pendentes e o recibo, só as pagas.</p>` : ''}
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="label">Nº do documento</label><input class="input font-mono !text-[13px]" id="pdfNum"></div>
          <div><label class="label">Data de emissão</label><input type="date" class="input" id="pdfEmissao"></div>
        </div>
        <div id="pdfVencWrap"><label class="label">Vencimento combinado <span class="font-normal text-slate-400">(opcional)</span></label><input type="date" class="input" id="pdfVenc"></div>
        <div><label class="label">Observações no PDF <span class="font-normal text-slate-400">(opcional)</span></label><textarea class="input" rows="3" id="pdfObs" placeholder="Ex.: Pagamento até dia 10. Enviar comprovante por WhatsApp."></textarea></div>
        <div class="rounded-xl bg-slate-50 px-4 py-3">
          <div class="text-xs text-slate-500">${U.esc(parceiro.nome)}</div>
          <div class="flex items-baseline justify-between"><span class="text-sm font-semibold text-slate-600" id="pdfCount"></span><span class="text-xl font-extrabold tnum text-slate-900" id="pdfTotal"></span></div>
          <div class="text-[11px] text-slate-400 mt-1 font-mono truncate" id="pdfFile"></div>
        </div>
      </div>
      <div class="min-h-[60vh] lg:min-h-[68vh] rounded-xl border border-slate-200 bg-slate-100 overflow-hidden relative">
        <iframe id="pdfFrame" class="w-full h-full absolute inset-0" title="Pré-visualização do PDF"></iframe>
        <div id="pdfErr" class="hidden absolute inset-0 grid place-items-center text-sm text-red-600 p-6 text-center"></div>
      </div>
    </div>`;

  Modal.open({
    title: 'Gerar documento em PDF', subtitle: 'Confira a pré-visualização antes de baixar', size: 'xl', body,
    footer: `
      <button class="btn btn-ghost mr-auto" data-close>Fechar</button>
      <button class="btn btn-ghost !w-10 !h-10 !p-0 justify-center" data-copy title="Copiar resumo" aria-label="Copiar resumo">${icon('copy')}</button>
      <button class="btn btn-wa !w-10 !h-10 !p-0 !rounded-full justify-center" data-wa title="Enviar PDF pelo WhatsApp" aria-label="Enviar PDF pelo WhatsApp">${icon('whatsapp', 'w-5 h-5')}</button>
      <button class="btn btn-primary" data-dl>${icon('download')} Baixar PDF</button>`,
    onClose() { if (url) URL.revokeObjectURL(url); },
    onMount(el) {
      const num = $('#pdfNum', el), em = $('#pdfEmissao', el), venc = $('#pdfVenc', el), obs = $('#pdfObs', el);
      /* Navegadores sem leitor de PDF embutido (ex.: Chrome no Android) baixariam o arquivo a cada atualização da prévia */
      const canInline = navigator.pdfViewerEnabled !== false;
      if (!canInline) {
        $('#pdfFrame', el).remove();
        $('#pdfErr', el).insertAdjacentHTML('beforebegin', `<div class="absolute inset-0 grid place-items-center p-6 text-center"><div><div class="w-12 h-12 rounded-2xl bg-white text-slate-500 grid place-items-center mx-auto mb-3 shadow-sm">${icon('file', 'w-6 h-6')}</div><p class="text-sm font-semibold text-slate-700">Este navegador não exibe PDF dentro da página.</p><p class="text-xs text-slate-500 mt-1 mb-4">Abra a prévia em outra aba ou baixe direto.</p><a id="pdfOpen" class="btn btn-ghost btn-sm" target="_blank" rel="noopener">${icon('eye', 'w-3.5 h-3.5')} Abrir prévia</a></div></div>`);
      }
      const syncUI = () => {
        $$('#pdfTipo [data-tipo]', el).forEach(b => {
          const on = b.dataset.tipo === st.tipo;
          b.style.borderColor = on ? (st.tipo === 'recibo' ? '#059669' : 'var(--accent)') : '#e2e8f0';
          b.style.background = on ? (st.tipo === 'recibo' ? '#ecfdf5' : 'color-mix(in srgb,var(--accent) 6%,white)') : '#fff';
        });
        $('#pdfVencWrap', el).classList.toggle('hidden', st.tipo === 'recibo');
        const itens = itensDo(st.tipo);
        $('#pdfCount', el).textContent = `${itens.length} ${U.plural(itens.length, 'arte', 'artes')} · ${st.tipo === 'recibo' ? 'Recibo' : 'Cobrança'}`;
        $('#pdfTotal', el).textContent = U.brl(U.sum(itens, l => l.valorTotal));
        $('#pdfFile', el).textContent = filename();
      };
      const preview = () => {
        try {
          const doc = PDFService.build(opts());
          if (url) URL.revokeObjectURL(url);
          url = doc.output('bloburl');
          $('#pdfErr', el).classList.add('hidden');
          if (canInline) $('#pdfFrame', el).src = url + '#toolbar=0&navpanes=0&view=FitH';
          else { const a = $('#pdfOpen', el); if (a) a.href = url; }
        } catch (err) {
          console.error(err);
          $('#pdfErr', el).textContent = 'Erro ao gerar a pré-visualização: ' + err.message;
          $('#pdfErr', el).classList.remove('hidden');
        }
      };
      const previewD = U.debounce(preview, 350);
      const setTipo = t => {
        st.tipo = t;
        if (st.auto) st.numero = DataService.proximoNumero(t);
        st.obs = obs.value = (t === 'cobranca' && parceiro.condicao && !obs.dataset.touched) ? `Condição de pagamento combinada: ${parceiro.condicao}.` : (obs.dataset.touched ? obs.value : '');
        num.value = st.numero; syncUI(); preview();
      };
      num.addEventListener('input', () => { st.numero = num.value.trim(); st.auto = st.numero === DataService.proximoNumero(st.tipo); previewD(); });
      em.value = st.emissao; em.addEventListener('change', () => { st.emissao = em.value; preview(); });
      venc.addEventListener('change', () => { st.vencimento = venc.value; preview(); });
      obs.addEventListener('input', () => { obs.dataset.touched = '1'; st.obs = obs.value; previewD(); });
      $$('#pdfTipo [data-tipo]', el).forEach(b => b.addEventListener('click', () => setTipo(b.dataset.tipo)));
      $('[data-copy]', el).addEventListener('click', async () => {
        const ok = await U.copy(whatsText(st.tipo, itensDo(st.tipo), parceiro));
        toast(ok ? 'Resumo copiado! Cole na conversa do WhatsApp junto com o PDF.' : 'Não foi possível copiar.', ok ? 'success' : 'error');
      });
      const registrar = o => {
        if (st.auto && st.numero === DataService.proximoNumero(st.tipo)) DataService.confirmarNumero(st.tipo);
        DataService.registrarDoc(o.itens.map(l => l.id), { tipo: st.tipo, numero: st.numero, data: st.emissao });
        st.auto = true; st.numero = DataService.proximoNumero(st.tipo); num.value = st.numero;
        if (State.view === 'financeiro') renderFinTable();
        preview();
      };
      $('[data-dl]', el).addEventListener('click', () => {
        try {
          const o = opts();
          if (!o.itens.length) { toast('Nenhuma arte para este modelo.', 'error'); return; }
          const nome = filename();
          PDFService.build(o).save(nome); registrar(o);
          toast(`${o.tipo === 'recibo' ? 'Recibo' : 'Cobrança'} baixado: ${nome}`);
        } catch (err) { console.error(err); toast('Erro ao gerar o PDF: ' + err.message, 'error'); }
      });
      $('[data-wa]', el).addEventListener('click', () => {
        let o, nome, blob;
        try { o = opts(); if (!o.itens.length) { toast('Nenhuma arte para este modelo.', 'error'); return; } nome = filename(); blob = PDFService.build(o).output('blob'); }
        catch (err) { console.error(err); toast('Erro ao gerar o PDF: ' + err.message, 'error'); return; }
        const texto = whatsText(st.tipo, o.itens, parceiro);
        const arq = new File([blob], nome, { type: 'application/pdf' });
        /* celular e navegadores com compartilhamento: envia o PDF + resumo (escolha o WhatsApp na lista) */
        if (navigator.canShare && navigator.canShare({ files: [arq] })) {
          navigator.share({ files: [arq], text: texto, title: nome }).then(() => { registrar(o); toast('PDF enviado.'); })
            .catch(e => { if (e && e.name !== 'AbortError') toast('Não foi possível compartilhar: ' + e.message, 'error'); });
          return;
        }
        /* computador sem compartilhamento: baixa o PDF e abre a conversa com o resumo */
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        registrar(o);
        const link = waLink(parceiro.whatsapp, texto) || ('https://wa.me/?text=' + encodeURIComponent(texto));
        window.open(link, '_blank', 'noopener');
        toast('PDF baixado e WhatsApp aberto com o resumo. Arraste o PDF para a conversa.', 'info');
      });
      setTipo(st.tipo);
    }
  });
}

const Extenso = (() => {
  const U_ = ['zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const D_ = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const C_ = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const ate999 = n => {
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, p = [];
    if (c) p.push(C_[c]);
    if (r) p.push(r < 20 ? U_[r] : D_[Math.floor(r / 10)] + (r % 10 ? ' e ' + U_[r % 10] : ''));
    return p.join(' e ');
  };
  const num = n => {
    n = Math.floor(Math.abs(Number(n) || 0));
    if (n < 20) return U_[n];
    const mi = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), r = n % 1000, p = [];
    if (mi) p.push(mi === 1 ? 'um milhão' : ate999(mi) + ' milhões');
    if (mil) p.push(mil === 1 ? 'mil' : ate999(mil) + ' mil');
    if (r) p.push(ate999(r));
    if (p.length > 1 && (r && (r < 100 || r % 100 === 0))) { const last = p.pop(); return p.join(' ') + ' e ' + last; }
    return p.join(' ');
  };
  const fem = s => s.replace(/\bum\b/g, 'uma').replace(/\bdois\b/g, 'duas').replace(/zentos\b/g, 'zentas').replace(/ientos\b/g, 'ientas');
  const reais = v => {
    v = Math.round((Number(v) || 0) * 100) / 100;
    const r = Math.floor(v), c = Math.round((v - r) * 100), p = [];
    if (r) p.push(num(r) + (r % 1e6 === 0 && r >= 1e6 ? ' de' : '') + (r === 1 ? ' real' : ' reais'));
    if (c) p.push(num(c) + (c === 1 ? ' centavo' : ' centavos'));
    return p.join(' e ') || 'zero reais';
  };
  return { num, fem: n => fem(num(n)), reais };
})();

const CT = {
  esc: s => U.esc(s == null ? '' : String(s)),
  /* número com extenso: 12 (doze) */
  n: (v, f) => `${v} (${f ? Extenso.fem(v) : Extenso.num(v)})`,
  brl: v => `${U.brlRaw(v)} (${Extenso.reais(v)})`,
  addMeses(iso, k) {
    const [y, m, d] = iso.split('-').map(Number);
    const ult = new Date(y, m - 1 + k + 1, 0).getDate();
    return U.iso(new Date(y, m - 1 + k, Math.min(d, ult)));
  },
  menos1(iso) { const [y, m, d] = iso.split('-').map(Number); return U.iso(new Date(y, m - 1, d - 1)); },
  ciclos(c) {
    const ini = c.dataInicio || c.dataAssinatura || U.today(), n = Math.max(1, +c.meses || 1);
    return Array.from({ length: n }, (_, i) => { const a = CT.addMeses(ini, i), b = CT.menos1(CT.addMeses(ini, i + 1)); return { i: i + 1, ini: a, fim: b, venc: a }; });
  },
  fimVigencia(c) { const cs = CT.ciclos(c); return cs[cs.length - 1].fim; },
  vazio: '__________________',
  v(x) { return (x == null || String(x).trim() === '') ? CT.vazio : String(x).trim(); }
};

    intro: 'Pelo presente instrumento particular, as partes abaixo identificadas celebram contrato de prestação de serviços, mediante as cláusulas seguintes:',
    partes: [['CONTRATANTE:', contratante], ['CONTRATADA:', contratada]],

  };
}

/* ---------- PDF ---------- */
PDFService.contrato = function (c) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 18, CW = W - 2 * M;
  const TP = Theme.pdf(DataService.emissor()), T = contratoTexto(c);
  const FB = PDFService.marca(doc);
  const ACC = TP.primary, ACC2 = TP.secondary, INK = TP.ink, BODY = TP.body || [60, 50, 55], LINE = TP.line;
  let y = 0;
  const LH = 4.55, FS = 9.4;
  const novaPagina = () => { doc.addPage(); y = 22; };
  const ensure = h => { if (y + h > H - 24) novaPagina(); };
  /* tokens com negrito (**...**) */
  const tokens = (txt, boldAll) => {
    const out = []; let colado = false;
    String(txt).split(/(\*\*.+?\*\*)/).forEach(seg => {
      if (!seg) return; const bold = boldAll || /^\*\*.+\*\*$/.test(seg); const t = bold && !boldAll ? seg.slice(2, -2) : seg.replace(/\*\*/g, '');
      t.split(/(\s+)/).forEach(w => {
        if (!w) return;
        if (/^\s+$/.test(w)) { colado = false; return; }
        if (colado && out.length) out[out.length - 1].p.push({ w, bold }); else out.push({ p: [{ w, bold }] });
        colado = true;
      });
    });
    return out;
  };
  /* soma por caractere: o getTextWidth do jsPDF aplica kerning, mas o texto é desenhado sem kerning */
  const cw_ = {}; const widP = pt => { const f = pt.bold ? 'bold' : 'normal'; doc.setFont('helvetica', f); let t = 0; for (const ch of pt.w) { const k = f + ch + doc.getFontSize(); t += cw_[k] != null ? cw_[k] : (cw_[k] = doc.getTextWidth(ch)); } return t; };
  const wid = tk => tk.p.reduce((a, pt) => a + widP(pt), 0);
  /* parágrafo justificado com prefixo opcional em negrito */
  const para = (txt, { prefix = '', x = M, w = CW, size = FS, color = BODY, gapAfter = 2.2, justify = true } = {}) => {
    doc.setFontSize(size);
    const tk = [...(prefix ? tokens(prefix, true) : []), ...tokens(txt)];
    const sp = (doc.setFont('helvetica', 'normal'), doc.getTextWidth(' '));
    const lines = []; let cur = [], cw = 0;
    tk.forEach(t => { const tw = wid(t); if (cur.length && cw + sp + tw > w) { lines.push(cur); cur = [t]; cw = tw; } else { cw += (cur.length ? sp : 0) + tw; cur.push(t); } });
    if (cur.length) lines.push(cur);
    lines.forEach((ln, li) => {
      ensure(LH);
      const ws = ln.map(wid), sum = ws.reduce((a, b) => a + b, 0);
      const last = li === lines.length - 1;
      const gap = justify && !last && ln.length > 1 ? (w - sum) / (ln.length - 1) : sp;
      let cx = x;
      ln.forEach((t, k) => { let px = cx; t.p.forEach(pt => { doc.setFont('helvetica', pt.bold ? 'bold' : 'normal'); doc.setTextColor(...(pt.bold ? INK : color)); doc.text(pt.w, px, y); px += widP(pt); }); cx += ws[k] + gap; });
      y += LH;
    });
    y += gapAfter;
  };
  /* faixa do título */
  doc.setFillColor(...ACC); doc.rect(0, 0, W, 24, 'F');
  doc.setFillColor(...ACC2); doc.rect(0, 24, W, 1.2, 'F');
  doc.setFont(FB, 'bold'); doc.setFontSize(12.5); doc.setTextColor(255, 255, 255);
  doc.text(doc.splitTextToSize(T.titulo, W - 40), W / 2, 14, { align: 'center' });
  y = 36;
  para(T.intro, { color: ACC2 });
  y += 1;
  T.partes.forEach(([l, t]) => para(t, { prefix: l, gapAfter: 3 }));
  T.secoes.forEach(s => {
    ensure(18);
    y += 2; doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, y, W - M, y); y += 7;
    doc.setFont(FB, 'bold'); doc.setFontSize(10.5); doc.setTextColor(...ACC); doc.text(s.titulo, M, y); y += 6;
    let idx = 0;
    s.i.forEach(it => {
      if (it.tabela) {
        ensure(10 + it.tabela.length * 7);
        doc.autoTable({ startY: y, margin: { left: M, right: M }, head: [it.head], body: it.tabela, theme: 'plain',
          styles: { font: 'helvetica', fontSize: 8.6, cellPadding: { top: 2, bottom: 2, left: 3, right: 3 }, textColor: BODY, lineColor: LINE, lineWidth: 0.2 },
          headStyles: { fillColor: ACC, textColor: [255, 255, 255], fontStyle: 'bold' }, alternateRowStyles: { fillColor: TP.alt || [252, 248, 245] },
          columnStyles: { 0: { fontStyle: 'bold', textColor: INK } } });
        y = doc.lastAutoTable.finalY + 4; return;
      }
      if (it.lista) {
        ensure(10 + it.lista.length * 5);
        doc.setFillColor(...TP.soft); const bh = 9 + it.lista.length * 4.8; doc.roundedRect(M, y - 4, CW, bh, 2, 2, 'F');
        doc.setFillColor(...ACC2); doc.rect(M, y - 4, 1.2, bh, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...INK); doc.text(it.titulo, M + 6, y + 1); y += 6.5;
        it.lista.forEach(li => { doc.setFont('helvetica', 'normal'); doc.setFontSize(8.8); doc.setTextColor(...BODY); doc.text('•  ' + li.replace(/\*\*/g, ''), M + 8, y); y += 4.8; });
        y += 4; return;
      }
      idx++; para(it, { prefix: `${s.num}.${idx}.` });
    });
  });
  y += 2; ensure(88);
  para(T.fecho, { gapAfter: 1 }); para(T.local, { justify: false });
  /* assinaturas */
  y += 12;
  T.assin.forEach(([a, r]) => {
    ensure(28);
    doc.setDrawColor(...INK); doc.setLineWidth(0.35); doc.line(W / 2 - 62, y, W / 2 + 62, y); y += 5;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(a.replace(/\*\*/g, ''), W / 2, y, { align: 'center' }); y += 5;
    if (r) { doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...BODY); doc.text(r, W / 2, y + 4, { align: 'center' }); y += 6; }
    y += 14;
  });
  /* marca d'água, flor e rodapé em todas as páginas */
  const MD = MARCAS_DAGUA[DataService.config().marcaDagua] || MARCAS_DAGUA.m;
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    if (TP.brand && MD.kind) {
      const mw = Theme.png(MD.kind, TP.flor || B27.rosa);
      if (mw) { try { const A = ID27[MD.vb], ww = MD.w, hh = ww * A.vb[3] / A.vb[2]; doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity: MD.op * 0.85 })); doc.addImage(mw, 'PNG', (W - ww) / 2, (H - hh) / 2 + 10, ww, hh); doc.restoreGraphicsState(); } catch (e) { /* */ } }
    }
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, H - 15, W - M, H - 15);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.4); doc.setTextColor(...(TP.muted || [140, 120, 128]));
    doc.text(T.rodape, W / 2, H - 9.5, { align: 'center' }); doc.text(`${i}/${n}`, W - M, H - 9.5, { align: 'right' });
  }
  return doc;
};

function contratoSalvar(silencioso) {
  const a = State.ct && State.ct.atual; if (!a) return null;
  const d = { ...a.data }; if (a.id) d.id = a.id;
  if (!d.titulo) d.titulo = d.tFantasia || d.tRazao || 'Contrato';
  const it = DataService.upsert('contratos', d, 'ct');
  State.ct.edit = it.id; State.ct.atual.id = it.id;
  if (!silencioso) toast('Contrato salvo.');
  return it;
}

function parcStats() {
  const L = DataService.lancamentos(), ini12 = U.addDays(U.today(), -365), st = {};
  L.forEach(l => {
    const x = st[l.parceiroId] || (st[l.parceiroId] = { n: 0, artes: 0, fat12: 0, total: 0, aberto: 0, nAberto: 0, ultima: '' });
    x.n++; x.artes += l.qtd; x.total += l.valorTotal;
    if (l.dataEntrega >= ini12) x.fat12 += l.valorTotal;
    if (l.statusPgto === 'pendente' && l.statusArte === 'entregue') { x.aberto += l.valorTotal; x.nAberto++; }
    if (l.dataEntrega > x.ultima) x.ultima = l.dataEntrega;
  });
  return st;
}

/* ---------- Google Agenda (API do Google Calendar, leitura) ---------- */
const Agenda = {
  TOK: 'mrdesign_gcal_token', SCOPE: 'https://www.googleapis.com/auth/calendar.readonly openid email profile',
  st: { mes: null, dia: null, eventos: null, cals: null, carregando: false, erro: '', perfil: null, buscouEm: 0 },
  cfg() { return DataService.integ().agenda; },
  fuso() { return Agenda.cfg().fuso || 'America/Fortaleza'; },
  /* token de acesso do Google (vale ~1h) — fica só neste navegador */
  token() { try { const t = JSON.parse(sessionStorage.getItem(Agenda.TOK) || localStorage.getItem(Agenda.TOK) || 'null'); return t && t.exp > Date.now() + 30000 ? t.v : null; } catch (e) { return null; } },
  salvarToken(v, seg) { try { localStorage.setItem(Agenda.TOK, JSON.stringify({ v, exp: Date.now() + (seg || 3600) * 1000 })); } catch (e) { /* */ } },
  limparToken() { try { localStorage.removeItem(Agenda.TOK); sessionStorage.removeItem(Agenda.TOK); } catch (e) { /* */ } },
  autoConectar(aba) { const a = Agenda.cfg(); if (aba === 'agenda' && DataService.integ().painel.aberto && a.clientId && a.conectado && !Agenda.token() && window.google && google.accounts && google.accounts.oauth2) Agenda.conectar(true); },
  carregarGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (Agenda._gis) return Agenda._gis;
    Agenda._gis = new Promise((ok, falha) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = () => ok(); s.onerror = () => { Agenda._gis = null; falha(new Error('Não foi possível carregar o login do Google.')); }; document.head.appendChild(s); });
    return Agenda._gis;
  },
  emailLogin() { const a = Agenda.cfg(); return a.email || ((Nuvem.usuario && Nuvem.usuario()) || {}).email || ''; },
  /* precisa ser chamado a partir de um clique (o Google abre uma janelinha) */
  conectar(silencioso) {
    const a = Agenda.cfg();
    if (!a.clientId) { toast('Cadastre o Client ID do Google em Integrações.', 'error'); return; }
    if (!(window.google && google.accounts && google.accounts.oauth2)) { Agenda.carregarGis().then(() => { if (!silencioso) toast('Clique de novo em "Conectar" para abrir o Google.', 'info'); }).catch(e => toast(e.message, 'error')); return; }
    const cli = google.accounts.oauth2.initTokenClient({
      client_id: a.clientId, scope: Agenda.SCOPE,
      callback: r => {
        if (r.error) { Agenda.st.erro = r.error === 'access_denied' ? 'Acesso negado no Google.' : 'O Google não autorizou (' + r.error + ').'; Agenda.renderPanel(); return; }
        Agenda.salvarToken(r.access_token, +r.expires_in);
        if (!a.conectado) DataService.saveInteg('agenda', { conectado: true });
        Agenda.st.erro = ''; Agenda.buscar(true);
      },
      error_callback: e => { if (!silencioso) { Agenda.st.erro = e && e.type === 'popup_closed' ? 'A janela do Google foi fechada.' : 'Permita pop-ups deste site para conectar ao Google.'; Agenda.renderPanel(); } }
    });
    cli.requestAccessToken({ prompt: a.conectado ? '' : 'consent', login_hint: Agenda.emailLogin() || undefined });
  },
  desconectar() {
    const t = Agenda.token(); Agenda.limparToken();
    try { if (t && window.google && google.accounts) google.accounts.oauth2.revoke(t, () => {}); } catch (e) { /* */ }
    DataService.saveInteg('agenda', { conectado: false });
    Object.assign(Agenda.st, { eventos: null, cals: null, perfil: null, erro: '' }); Agenda.renderPanel();
  },
  async api(path) {
    const t = Agenda.token(); if (!t) { const e = new Error('sem token'); e.semToken = true; throw e; }
    const r = await fetch('https://www.googleapis.com' + path, { headers: { Authorization: 'Bearer ' + t } });
    if (r.status === 401) { Agenda.limparToken(); const e = new Error('sessão do Google expirou'); e.semToken = true; throw e; }
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error((d.error && d.error.message) || 'Erro ' + r.status + ' no Google Agenda.'); }
    return r.json();
  },
  faixa() {
    const m = Agenda.st.mes || U.today().slice(0, 7);
    const [y, mo] = m.split('-').map(Number);
    const ini = new Date(y, mo - 1, 1); ini.setDate(ini.getDate() - ini.getDay());
    const fimGrade = new Date(y, mo, 0); fimGrade.setDate(fimGrade.getDate() + (6 - fimGrade.getDay()) + 1);
    const lim = new Date(); lim.setDate(lim.getDate() + 60);
    return { de: ini, ate: fimGrade > lim ? fimGrade : lim };
  },
  async buscar(forcar) {
    if (Agenda.st.carregando) return;
    if (!Agenda.token()) { Agenda.renderPanel(); return; }
    const f = Agenda.faixa(), chave = U.iso(f.de) + U.iso(f.ate);
    if (!forcar && Agenda.st.eventos && Agenda.st.chave === chave && Date.now() - Agenda.st.buscouEm < 5 * 60000) { Agenda.renderPanel(); return; }
    Agenda.st.carregando = true; Agenda.renderPanel();
    try {
      if (!Agenda.st.perfil) { try { Agenda.st.perfil = await Agenda.api('/oauth2/v3/userinfo'); if (Agenda.st.perfil.email && Agenda.cfg().email !== Agenda.st.perfil.email) DataService.saveInteg('agenda', { email: Agenda.st.perfil.email }); } catch (e) { if (e.semToken) throw e; } }
      if (!Agenda.st.cals) { const cl = await Agenda.api('/calendar/v3/users/me/calendarList?minAccessRole=reader&maxResults=50'); Agenda.st.cals = (cl.items || []).map(c => ({ id: c.id, nome: c.summaryOverride || c.summary, cor: c.backgroundColor || '#10b981', primaria: !!c.primary, visivel: c.selected !== false })); }
      const escolhidas = Agenda.cfg().calendarios || [];
      const cals = Agenda.st.cals.filter(c => escolhidas.length ? escolhidas.includes(c.id) : c.visivel);
      const q = `timeMin=${encodeURIComponent(f.de.toISOString())}&timeMax=${encodeURIComponent(f.ate.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=250&timeZone=${encodeURIComponent(Agenda.fuso())}`;
      const listas = await Promise.all(cals.map(c => Agenda.api(`/calendar/v3/calendars/${encodeURIComponent(c.id)}/events?${q}`).then(r => (r.items || []).filter(e => e.status !== 'cancelled').map(e => ({
        id: e.id, titulo: e.summary || '(sem título)', link: e.htmlLink, cal: c.nome, cor: c.cor,
        diaInteiro: !!(e.start && e.start.date), ini: (e.start && (e.start.dateTime || e.start.date)) || '', fim: (e.end && (e.end.dateTime || e.end.date)) || ''
      }))).catch(() => [])));
      Agenda.st.eventos = listas.flat().sort((a, b) => a.ini.localeCompare(b.ini));
      Agenda.st.chave = chave; Agenda.st.buscouEm = Date.now(); Agenda.st.erro = '';
    } catch (e) {
      if (!e.semToken) Agenda.st.erro = e.message;
    }
    Agenda.st.carregando = false; Agenda.renderPanel();
  },
  /* dias (AAAA-MM-DD) que um evento ocupa */
  dias(ev) {
    const d0 = ev.ini.slice(0, 10); let d1 = (ev.fim || ev.ini).slice(0, 10);
    if (ev.diaInteiro) d1 = U.addDays(d1, -1); else if (ev.fim && ev.fim.slice(11, 16) === '00:00' && d1 > d0) d1 = U.addDays(d1, -1);
    const out = []; let d = d0; let n = 0; while (d <= d1 && n < 62) { out.push(d); d = U.addDays(d, 1); n++; } return out;
  },
  doDia(dia) { return (Agenda.st.eventos || []).filter(e => Agenda.dias(e).includes(dia)); },
  hora(iso) { return iso && iso.length > 10 ? iso.slice(11, 16) : ''; },
  quando(ev, comData) {
    const d = ev.ini.slice(0, 10), [y, m, dd] = d.split('-');
    const data = comData ? `${dd}/${m} · ` : '';
    if (ev.diaInteiro) return data + 'Dia inteiro';
    return data + Agenda.hora(ev.ini) + (ev.fim ? '–' + Agenda.hora(ev.fim) : '');
  },
  novoEventoUrl(titulo = '', data = '', detalhes = '', recur = '') {
    let u = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&details=${encodeURIComponent(detalhes)}`;
    if (recur) u += `&recur=${encodeURIComponent(recur)}`;
    if (data) { const d = data.replace(/-/g, ''); u += `&dates=${d}/${U.addDays(data, 1).replace(/-/g, '')}`; }
    return u;
  },
  card(ev, comData) {
    return `<a href="${U.esc(ev.link || '#')}" target="_blank" rel="noopener" class="ag-ev" style="--c:${U.esc(ev.cor)}"><div class="t">${U.esc(ev.titulo)}</div><div class="s">${U.esc(Agenda.quando(ev, comData))} · ${U.esc(ev.cal)}</div></a>`;
  },
  renderPanel() {
    const body = $('#rpBody'); if (!body || DataService.integ().painel.aba !== 'agenda') return;
    const a = Agenda.cfg(), st = Agenda.st, hoje = U.today();
    st.mes = st.mes || hoje.slice(0, 7); st.dia = st.dia || hoje;
    if (!a.clientId) {
      body.innerHTML = `<div class="p-5 overflow-y-auto">
        <div class="text-center py-5"><div class="w-14 h-14 rounded-2xl grid place-items-center mx-auto mb-3" style="background:var(--soft);color:var(--accent)">${icon('calendar', 'w-7 h-7')}</div>
        <p class="font-semibold font-head" style="color:var(--ink-head)">Conecte o Google Agenda</p><p class="text-sm text-slate-500 mt-1">Falta cadastrar o <b>Client ID</b> do Google (uma vez só). Depois a agenda fica vinculada à sua conta e aparece em qualquer aparelho.</p></div>
        <button class="btn btn-primary w-full" data-action="panel-cfg">${icon('panel')} Abrir Integrações</button></div>`;
      return;
    }
    const tem = !!Agenda.token();
    if (tem && !st.eventos && !st.carregando && !st.erro) { setTimeout(() => Agenda.buscar(), 0); }
    const [y, m] = st.mes.split('-').map(Number);
    const ini = new Date(y, m - 1, 1); ini.setDate(ini.getDate() - ini.getDay());
    const fim = new Date(y, m, 0); fim.setDate(fim.getDate() + (6 - fim.getDay()));
    const dias = []; for (let d = new Date(ini); d <= fim; d.setDate(d.getDate() + 1)) dias.push(U.iso(d));
    const comEv = new Set(); (st.eventos || []).forEach(e => Agenda.dias(e).forEach(d => comEv.add(d)));
    const p = st.perfil || {}, e = DataService.emissor();

    const lbl = U.dateLong(st.dia); const dow = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'][new Date(st.dia + 'T12:00').getDay()];
    const evDia = Agenda.doDia(st.dia);
    const prox = (st.eventos || []).filter(ev => ev.ini.slice(0, 10) > st.dia || (ev.ini.slice(0, 10) <= st.dia && (ev.fim || ev.ini).slice(0, 10) > st.dia && !evDia.includes(ev))).slice(0, 8);
    body.innerHTML = `<div class="flex-1 overflow-y-auto scroll-thin ag-wrap">
      <div class="flex items-center gap-3 px-5 pt-5">
        <span class="w-12 h-12 rounded-full overflow-hidden grid place-items-center shrink-0" style="background:var(--accent)">${foto}</span>
        <div class="min-w-0 flex-1"><div class="font-semibold truncate" style="color:var(--ink-head)">${U.esc(nome)}</div><div class="text-xs text-slate-500 truncate">${U.esc(p.email || Agenda.emailLogin() || 'Google Agenda')}</div></div>
        <a class="icon-btn" href="${Agenda.novoEventoUrl('', st.dia)}" target="_blank" rel="noopener" title="Novo evento">${icon('plus')}</a>
      </div>
      <div class="ag-cal mx-4 mt-4">
        <div class="flex items-center justify-between mb-3">
          <button class="ag-nav" data-action="ag-mes" data-d="-1" aria-label="Mês anterior">‹</button>
          <span class="font-semibold font-head" style="color:var(--ink-head)">${MESES[m - 1]} de ${y}</span>
          <button class="ag-nav" data-action="ag-mes" data-d="1" aria-label="Próximo mês">›</button>
        </div>
        <div class="grid grid-cols-7 text-center text-[11px] font-semibold text-slate-500 mb-1">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(d => `<span>${d}</span>`).join('')}</div>
        <div class="grid grid-cols-7 gap-y-1 text-center">${dias.map(d => {
          const fora = d.slice(0, 7) !== st.mes, cls = [d === hoje ? 'hoje' : '', d === st.dia ? 'sel' : '', fora ? 'fora' : ''].join(' ');
          return `<button class="ag-dia ${cls}" data-action="ag-dia" data-d="${d}"><span>${+d.slice(8)}</span>${comEv.has(d) ? '<i></i>' : ''}</button>`;
        }).join('')}</div>
        <div class="flex justify-end mt-2"><button class="btn btn-ghost btn-sm" data-action="ag-hoje">Hoje</button></div>
      </div>
      <div class="px-5 mt-3 text-[13px] flex flex-wrap items-center gap-x-3 gap-y-1">
        ${tem ? `<span class="font-semibold" style="color:#059669">● Google Agenda conectado</span><button class="font-semibold" style="color:var(--accent)" data-action="ag-atualizar">${st.carregando ? 'Atualizando…' : 'Atualizar'}</button><button class="text-slate-500" data-action="ag-desconectar">Desconectar</button>`
          : `<button class="btn btn-primary btn-sm" data-action="ag-conectar">${icon('calendar', 'w-3.5 h-3.5')} ${a.conectado ? 'Carregar eventos' : 'Conectar Google Agenda'}</button>`}
      </div>
      ${st.erro ? `<div class="mx-5 mt-3 rounded-xl bg-red-50 text-red-700 text-xs px-3 py-2">${U.esc(st.erro)}</div>` : ''}
      ${tem && st.eventos ? `
        <div class="px-5 mt-5"><h3 class="font-semibold font-head text-[15px] mb-2" style="color:var(--ink-head)">${dow}, ${lbl.replace(/ de \d{4}$/, '')}</h3>
          ${evDia.length ? `<div class="space-y-2">${evDia.map(ev => Agenda.card(ev, false)).join('')}</div>` : '<p class="text-sm text-slate-400">Nada agendado neste dia.</p>'}</div>

          : `<p class="px-5 mt-4 pb-6 text-xs text-slate-500 leading-relaxed">${a.conectado ? 'Por segurança o Google pede uma nova autorização de tempos em tempos. Clique em "Carregar eventos" — sem senha, é só confirmar.' : 'A agenda fica vinculada à sua conta do sistema: depois de conectar uma vez, ela aparece sempre que você entrar.'}</p>`)}
    </div>`;
  }
};

const Trello = {

  ready() { const c = Trello.cfg(); return !!(Trello.boardId() && c.key && c.token); },

    const c = Trello.cfg(); const sep = path.includes('?') ? '&' : '?';
    const r = await fetch(`https://api.trello.com/1${path}${sep}key=${encodeURIComponent(c.key)}&token=${encodeURIComponent(c.token)}`, opts);
    if (!r.ok) throw new Error(r.status === 401 ? 'Chave ou token do Trello inválidos.' : r.status === 404 ? 'Quadro não encontrado (confira o link).' : `O Trello respondeu com erro ${r.status}.`);

    try {
      const id = Trello.boardId();

        Trello.api(`/boards/${id}?fields=name,url`),

/* ---------- WhatsApp ---------- */
function openWhatsModal(preset = {}) {
  const parceiros = DataService.parceiros().filter(p => p.status === 'ativo');
  const L = DataService.lancamentos();
  const comPend = new Set(L.filter(l => l.statusPgto === 'pendente' && l.statusArte === 'entregue').map(l => l.parceiroId));
  const abertoPor = {}; L.forEach(l => { if (l.statusPgto === 'pendente' && l.statusArte === 'entregue') abertoPor[l.parceiroId] = (abertoPor[l.parceiroId] || 0) + l.valorTotal; });
  const maior = Object.entries(abertoPor).sort((a, b) => b[1] - a[1])[0];
  const st = { pid: preset.pid !== undefined ? preset.pid : (State.fin.parceiro || (maior ? maior[0] : (parceiros[0] || {}).id || '')), modelo: '' };
  const modelos = [
    ['cobranca', 'Cobrança das pendências', 'file'],
    ['recibo', 'Confirmação do último pagamento', 'receipt'],
    ['entrega', 'Aviso de arte entregue', 'package'],
    ['livre', 'Mensagem livre', 'chat']
  ];
  const texto = () => {
    const p = DataService.parceiro(st.pid); const e = DataService.emissor();
    if (!p) return '';
    const mine = L.filter(l => l.parceiroId === p.id);
    if (st.modelo === 'custom') return preset.texto || '';
    if (st.modelo === 'cobranca') {
      const it = mine.filter(l => l.statusPgto === 'pendente' && l.statusArte === 'entregue');
      return it.length ? whatsText('cobranca', it, p) : `Olá, ${p.nome}! Tudo bem? Passando para avisar que não há pendências em aberto no momento. Obrigado pela parceria!${e.nome ? '\n— ' + e.nome : ''}`;
    }
    if (st.modelo === 'recibo') {
      const pagos = mine.filter(l => l.statusPgto === 'pago' && l.dataPgto);
      const ult = pagos.map(l => l.dataPgto).sort().pop();
      return ult ? whatsText('recibo', pagos.filter(l => l.dataPgto === ult), p) : `Olá, ${p.nome}! Ainda não há pagamentos registrados.`;
    }
    if (st.modelo === 'entrega') {
      const ult = [...mine].sort((a, b) => b.dataEntrega.localeCompare(a.dataEntrega) || (b.criadoEm || '').localeCompare(a.criadoEm || ''))[0];
      return ult ? `Olá, ${p.nome}! Tudo bem?\n\nA arte *${ult.titulo}* (${ult.servicoNome}) está pronta e segue em anexo. ✨\n\nQualquer ajuste é só me avisar!${e.nome ? '\n— ' + e.nome : ''}` : `Olá, ${p.nome}! Tudo bem?`;
    }
    return `Olá, ${p.nome}! Tudo bem?\n\n`;
  };
  Modal.open({
    title: preset.titulo ? 'WhatsApp · ' + U.esc(preset.titulo) : 'Enviar pelo WhatsApp', subtitle: 'Escolha o parceiro e o modelo; você pode editar o texto antes de enviar', size: 'lg',
    body: `
      <div class="grid sm:grid-cols-[1fr_1fr] gap-4 mb-4">
        <div><label class="label">Parceiro</label><select class="input" id="waP"><option value="">Outro contato</option>${parceiros.map(p => `<option value="${p.id}" ${p.id === st.pid ? 'selected' : ''}>${U.esc(p.nome)}${comPend.has(p.id) ? ' • com pendências' : ''}</option>`).join('')}</select></div>
        <div><label class="label">Número do WhatsApp</label><input class="input" id="waNum" placeholder="(00) 90000-0000 — vazio: escolher contato no WhatsApp"></div>
      </div>
      <label class="label">Modelo</label>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-4" id="waModelos">
        ${modelos.map(([k, l, i]) => `<button type="button" data-m="${k}" class="rounded-xl border-2 px-3 py-2.5 text-left text-sm font-semibold text-slate-700 flex items-center gap-2 transition" style="border-color:var(--line)">${icon(i)} <span class="leading-tight">${l}</span></button>`).join('')}
      </div>
      <label class="label">Mensagem</label>
      <textarea class="input !text-[13px] leading-relaxed" rows="11" id="waTxt"></textarea>
      <p class="text-[11px] text-slate-400 mt-1.5">*texto* fica em negrito no WhatsApp. Para mandar o PDF junto, gere o documento no Financeiro e anexe na conversa.</p>`,
    footer: `<button class="btn btn-ghost mr-auto" data-close>Cancelar</button><button class="btn btn-ghost" data-copy>${icon('copy')} Copiar</button><button class="btn btn-wa" data-send>${icon('send')} Abrir no WhatsApp</button>`,
    onMount(el) {
      const num = $('#waNum', el), txt = $('#waTxt', el);
      const setP = () => { const p = DataService.parceiro(st.pid); num.value = p ? (p.whatsapp || '') : (preset.numero || ''); };
      const setM = m => {
        st.modelo = m;
        $$('#waModelos [data-m]', el).forEach(b => { const on = b.dataset.m === m; b.style.borderColor = on ? '#25D366' : 'var(--line)'; b.style.background = on ? '#effcf3' : '#fff'; });
        txt.value = texto();
      };
      $('#waP', el).addEventListener('change', e => { st.pid = e.target.value; setP(); txt.value = texto(); });
      $$('#waModelos [data-m]', el).forEach(b => b.addEventListener('click', () => setM(b.dataset.m)));
      $('[data-copy]', el).addEventListener('click', async () => { const ok = await U.copy(txt.value); toast(ok ? 'Mensagem copiada.' : 'Não foi possível copiar.', ok ? 'success' : 'error'); });
      $('[data-send]', el).addEventListener('click', () => {
        const link = waLink(num.value, txt.value) || `https://wa.me/?text=${encodeURIComponent(txt.value)}`;
        window.open(link, '_blank', 'noopener');
      });
      setP();
      if (preset.texto) { st.modelo = 'custom'; txt.value = preset.texto; if (preset.numero) num.value = preset.numero; }
      else setM(preset.modelo || (comPend.has(st.pid) ? 'cobranca' : 'livre'));
    }
  });
}

function moverEtapa(id, etapa) {
  const l = DataService.lancamento(id); if (!l || etapaDe(l) === etapa) return;
  const patch = { etapa };
  let msg = `Movido para ${etapaNome(etapa)}.`;
  if (etapa === 'entregue') { patch.dataEntrega = U.today(); msg = 'Arte entregue hoje e enviada ao financeiro como pendência.'; }
  DataService.updateLancamento(id, patch);
  renderProdTable();
  toast(msg, 'success', etapa === 'entregue' && l.statusPgto === 'pendente' ? { label: 'Avisar no WhatsApp', fn: () => openWhatsModal({ pid: l.parceiroId, modelo: 'entrega' }) } : null);
}

/* =====================================================================
   RECORRÊNCIAS — contratos mensais (receitas) e despesas fixas
   ===================================================================== */
const Recorrencias = {
  run() {
    const hojeYm = U.today().slice(0, 7);
    let nRec = 0, nDesp = 0;
    DataService.col('recorrencias').forEach(r => {
      if (!r.ativo || !r.inicio) return;
      r.gerados = r.gerados || [];
      for (let ym = r.inicio; ym <= hojeYm; ym = U.ymAdd(ym, 1)) {
        if (r.fim && ym > r.fim) break;
        if (r.gerados.includes(ym)) continue;
        const dia = String(Math.min(Number(r.dia) || 1, +U.lastDay(ym).slice(8))).padStart(2, '0');
        const data = `${ym}-${dia}`;
        const mes = MESES[+ym.slice(5) - 1];
        if (r.tipo === 'despesa') {
          DataService.upsert('despesas', { data, descricao: r.descricao, categoria: r.categoria || 'Outros', valor: U.num(r.valor), metodo: r.metodo || '', obs: 'Gerada pela despesa fixa', recorrenciaId: r.id }, 'd', true);
          nDesp++;
        } else {
          const p = DataService.parceiro(r.parceiroId), s = DataService.servico(r.servicoId);
          if (!p || !s) continue;
          DataService.addLancamentos([{ grupoId: null, parceiroId: p.id, parceiroNome: p.nome, servicoId: s.id, servicoNome: s.nome, categoria: s.categoria,
            titulo: `${r.descricao || 'Contrato mensal'} - ${mes}`, qtd: 1, valorUnit: U.num(r.valor), valorTotal: U.num(r.valor), dataEntrega: data,
            etapa: 'entregue', statusArte: 'entregue', statusPgto: 'pendente', dataPgto: '', metodoPgto: '', obsPgto: '', obs: 'Gerado pelo contrato recorrente', recorrenciaId: r.id }], true);
          nRec++;
        }
        r.gerados.push(ym);
      }
    });
    DataService.persistNow();
    return { nRec, nDesp };
  }
};

/* =====================================================================
   COBRANÇAS — próxima data pela condição de cada parceiro
   ===================================================================== */
const Cobranca = {
  FREQS: [['', 'Sem lembrete'], ['mensal', 'Mensal (dia fixo)'], ['quinzenal', 'Quinzenal (dia 15 e último dia)'], ['semanal', 'Semanal (segunda-feira)'], ['entrega', 'Na entrega']],
  proxima(p, hoje = U.today()) {
    const f = p.cobrancaFreq, ym = hoje.slice(0, 7);
    const diaEm = (m, d) => `${m}-${String(Math.min(d, +U.lastDay(m).slice(8))).padStart(2, '0')}`;
    if (f === 'mensal') { const d = Number(p.cobrancaDia) || 1; const a = diaEm(ym, d); return a >= hoje ? a : diaEm(U.ymAdd(ym, 1), d); }
    if (f === 'quinzenal') { return [diaEm(ym, 15), U.lastDay(ym), diaEm(U.ymAdd(ym, 1), 15)].find(x => x >= hoje); }
    if (f === 'semanal') { const d = new Date(hoje + 'T12:00:00'); const add = (8 - d.getDay()) % 7; return U.addDays(hoje, add); }
    if (f === 'entrega') return hoje;
    return null;
  },
  rrule(p) {
    if (p.cobrancaFreq === 'mensal') return `RRULE:FREQ=MONTHLY;BYMONTHDAY=${Number(p.cobrancaDia) || 1}`;
    if (p.cobrancaFreq === 'semanal') return 'RRULE:FREQ=WEEKLY;BYDAY=MO';
    if (p.cobrancaFreq === 'quinzenal') return 'RRULE:FREQ=MONTHLY;BYMONTHDAY=15,-1';
    return '';
  },
  descricao(p) { const f = Cobranca.FREQS.find(x => x[0] === p.cobrancaFreq); return p.cobrancaFreq === 'mensal' ? `Todo dia ${Number(p.cobrancaDia) || 1}` : (f ? f[1] : ''); },
  lista(dias = 7) {
    const hoje = U.today(), lim = U.addDays(hoje, dias);
    const L = DataService.lancamentos();
    return DataService.parceiros().map(p => {
      const pend = L.filter(l => l.parceiroId === p.id && l.statusPgto === 'pendente' && l.statusArte === 'entregue');
      if (!pend.length) return null;
      const total = U.sum(pend, l => l.valorTotal);
      const antiga = pend.map(l => l.dataEntrega).sort()[0];
      const prox = Cobranca.proxima(p, hoje);
      const atrasado = U.daysSince(antiga) > 35;
      if (!prox && !atrasado) return null;
      if (prox && prox > lim && !atrasado) return null;
      return { p, pend, total, prox: prox || hoje, atrasado, antiga };
    }).filter(Boolean).sort((a, b) => (b.atrasado - a.atrasado) || a.prox.localeCompare(b.prox) || b.total - a.total);
  },
  quando(d) { const n = -U.daysSince(d); return n <= 0 ? 'Hoje' : n === 1 ? 'Amanhã' : `Em ${n} dias · ${U.dateShort(d)}`; }
};

/* =====================================================================
   REVISÃO DA PLANILHA — itens com data ou status estimados na importação
   ===================================================================== */
const Revisao = {
  get SEM_STATUS() { return new Set(DataService.config().revSemStatus || []); },
  imp: l => (l.obs || '').includes('Importado da planilha'),
  pendEst: l => Revisao.imp(l) && l.statusPgto === 'pendente' && !(l.rev && l.rev.pend) && (Revisao.SEM_STATUS.has(l.parceiroId) || (l.dataEntrega || '') < '2026'),
  pgtoEst: l => l.statusPgto === 'pago' && (l.obsPgto || '').includes('Data estimada') && !(l.rev && l.rev.pgto),
  semData: l => (l.obs || '').includes('sem data na planilha') && !(l.rev && l.rev.data),
  contagem() { const L = DataService.lancamentos(); return { pend: L.filter(Revisao.pendEst), pgto: L.filter(Revisao.pgtoEst), data: L.filter(Revisao.semData) }; },
  marcar(ids, campo, extra = {}) { ids.forEach(id => { const l = DataService.lancamento(id); if (l) DataService.updateLancamento(id, { ...extra, rev: { ...(l.rev || {}), [campo]: true } }, true); }); DataService.persistNow(); }
};

function viewOrcamentos() {

function renderOrcBody() {
  const f = State.orc, q = U.norm(f.q);
  const all = DataService.col('orcamentos');
  const list = all.filter(o => (!f.status || o.status === f.status) && (!q || U.norm([o.numero, o.titulo, orcCliente(o)].join(' ')).includes(q))).sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || ''));
  const abertos = all.filter(o => o.status === 'enviado' || o.status === 'rascunho');
  const decididos = all.filter(o => o.status === 'aprovado' || o.status === 'recusado');
  const aprov = all.filter(o => o.status === 'aprovado');
  const card = (l, v, sub, tone = 'text-slate-900') => `<div class="card px-4 py-3.5"><div class="text-xs font-semibold text-slate-500">${l}</div><div class="text-xl font-extrabold tnum ${tone}">${v}</div><div class="text-[11px] text-slate-400">${sub}</div></div>`;
  const hoje = U.today();
  $('#orcBody').innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
      ${card('Em negociação', U.brl(U.sum(abertos, orcTotal)), `${abertos.length} ${U.plural(abertos.length, 'orçamento', 'orçamentos')}`)}
      ${card('Aprovados', U.brl(U.sum(aprov, o => o.valorFechado || orcTotal(o))), `${aprov.length} ${U.plural(aprov.length, 'proposta', 'propostas')}`, 'text-emerald-700')}
      ${card('Taxa de aprovação', decididos.length ? Math.round((aprov.length / decididos.length) * 100) + '%' : '—', 'entre aprovados e recusados')}
      ${card('Ticket médio', aprov.length ? U.brl(U.sum(aprov, o => o.valorFechado || orcTotal(o)) / aprov.length) : '—', 'das propostas aprovadas')}
    </div>
    <div class="card overflow-hidden">${list.length ? `
      <div class="overflow-x-auto scroll-thin"><table class="tbl min-w-[900px]">
        <thead><tr><th>Nº</th><th>Cliente</th><th>Proposta</th><th class="num">Valor</th><th>Validade</th><th>Status</th><th class="text-right">Ações</th></tr></thead>
        <tbody>${list.map(o => {
          const venc = o.validade && o.validade < hoje && (o.status === 'enviado' || o.status === 'rascunho');
          return `<tr>
            <td class="font-mono text-xs text-slate-500 whitespace-nowrap">${U.esc(o.numero)}</td>
            <td class="font-semibold text-slate-700"><span class="flex items-center gap-2.5">${pAvatar(DataService.parceiro(o.parceiroId) || { nome: orcCliente(o) || '?' }, 'w-7 h-7', 'text-[9px]')}<span>${U.esc(orcCliente(o) || '—')}${o.parceiroId ? '' : ' <span class="text-[10px] font-semibold text-slate-400 uppercase">novo</span>'}</span></span></td>
            <td><div class="text-slate-800 font-medium">${U.esc(o.titulo || 'Sem título')}</div><div class="text-xs text-slate-400">${(o.itens || []).length} ${U.plural((o.itens || []).length, 'item', 'itens')}${o.aVista ? ' · à vista ' + U.brl(o.aVista) : ''}</div></td>
            <td class="num font-semibold">${U.brl(o.valorFechado || orcTotal(o))}</td>
            <td class="tnum text-sm ${venc ? 'text-red-600 font-semibold' : 'text-slate-600'}">${o.validade ? U.date(o.validade) : '—'}${venc ? '<div class="text-[10px]">vencido</div>' : ''}</td>
            <td><span class="badge ${ORC_STATUS[o.status][1]}">${ORC_STATUS[o.status][0]}</span></td>
            <td class="text-right whitespace-nowrap">
              <button class="icon-btn" data-action="pdf-orc" data-id="${o.id}" title="Gerar PDF da proposta">${icon('file')}</button>
              <button class="icon-btn ok" data-action="whats-orc" data-id="${o.id}" title="Enviar pelo WhatsApp">${icon('whatsapp')}</button>
              ${o.status !== 'aprovado' ? `<button class="icon-btn ok" data-action="aprovar-orc" data-id="${o.id}" title="Aprovar e gerar lançamentos">${icon('checkCircle')}</button>` : ''}
              <button class="icon-btn" data-action="editar-orc" data-id="${o.id}" title="Editar">${icon('pencil')}</button>
              <button class="icon-btn" data-action="duplicar-orc" data-id="${o.id}" title="Duplicar">${icon('copy')}</button>
              <button class="icon-btn danger" data-action="excluir-orc" data-id="${o.id}" title="Excluir">${icon('trash')}</button>
            </td></tr>`;
        }).join('')}</tbody></table></div>`
      : emptyState('Nenhum orçamento ainda', 'Comece por um modelo: Identidade Visual ou Social Media, com os textos das suas propostas.', `<button class="btn btn-primary" data-action="novo-orc">${icon('plus')} Novo orçamento</button>`)}
    </div>`;
}

        </div>
        <div class="grid sm:grid-cols-[2fr_1fr_1fr_1fr] gap-4">
          <div><label class="label">Título da proposta *</label><input class="input" name="titulo" value="${U.esc(o.titulo)}" placeholder="Ex.: Identidade Visual"></div>

          <div><div class="label">Investimento (total)</div><div class="text-2xl font-extrabold tnum" style="color:var(--ink-head)" id="oTotal"></div></div>
          <div><label class="label">Condição do total</label><input class="input" name="parcelamento" value="${U.esc(o.parcelamento || '')}" placeholder="Ex.: em até 12x sem juros"></div>

        </div>
        <div class="grid lg:grid-cols-2 gap-4">
          <div><label class="label">Etapas do projeto <span class="font-normal text-slate-400">(uma por linha: "Título: descrição")</span></label><textarea class="input !text-[13px]" rows="6" name="etapas">${U.esc(o.etapas || '')}</textarea></div>
          <div class="space-y-4">
            <div><label class="label">Prazo</label><textarea class="input !text-[13px]" rows="3" name="prazo">${U.esc(o.prazo || '')}</textarea></div>
            <div><label class="label">Formas de pagamento <span class="font-normal text-slate-400">(uma por linha)</span></label><textarea class="input !text-[13px]" rows="3" name="pagamento">${U.esc(o.pagamento || '')}</textarea></div>
          </div>
        </div>
        <div><label class="label">Observações</label><textarea class="input !text-[13px]" rows="3" name="obs">${U.esc(o.obs || '')}</textarea></div>
      </form>`,
    footer: `<button class="btn btn-ghost mr-auto" data-close>Cancelar</button><button class="btn btn-ghost" data-save-pdf>${icon('file')} Salvar e ver PDF</button><button class="btn btn-primary" data-save>${icon('check')} Salvar orçamento</button>`,
    onMount(el, api) {
      const form = $('#oForm', el), F = n => form.elements[n], box = $('#oItens', el);
      const syncCli = () => { const novoC = !F('parceiroId').value; $('#oNovoCli', el).style.opacity = novoC ? 1 : .4; $('#oNovoWa', el).style.opacity = novoC ? 1 : .4; F('clienteNome').disabled = !novoC; F('clienteWhats').disabled = !novoC; };
      const recalc = () => {
        let t = 0;
        $$('.orc-item', box).forEach(r => { const s = (parseInt($('[data-i=qtd]', r).value, 10) || 1) * U.num($('[data-i=valorUnit]', r).value); t += s; $('[data-i=sub]', r).textContent = s ? U.brl(s) : 'Incluso'; });
        $('#oTotal', el).textContent = U.brl(t);
      };
      const aplicar = k => {
        const m = PROP_MODELOS[k];
        box.innerHTML = m.itens.map(([d, dt, q, v]) => itemRow({ descricao: d, detalhe: dt, qtd: q, valorUnit: v })).join('');
        ['etapas', 'prazo', 'pagamento', 'obs', 'parcelamento'].forEach(n => F(n).value = m[n] || '');
        F('aVista').value = m.aVista ? U.dec(m.aVista) : '';
        if (!F('titulo').value || Object.values(PROP_MODELOS).some(x => x.titulo === F('titulo').value)) F('titulo').value = m.titulo;
        F('servicoId').value = m.servicoId || '';
        $$('#oModelos [data-mod]', el).forEach(b => { const on = b.dataset.mod === k; b.style.borderColor = on ? 'var(--accent)' : 'var(--line)'; b.style.background = on ? 'color-mix(in srgb,var(--accent) 6%,white)' : '#fff'; });
        recalc();
      };
      $$('#oModelos [data-mod]', el).forEach(b => b.addEventListener('click', () => aplicar(b.dataset.mod)));
      box.addEventListener('input', recalc);
      box.addEventListener('change', e => { if (e.target.dataset.i === 'valorUnit') e.target.value = U.dec(U.num(e.target.value)); recalc(); });
      box.addEventListener('click', e => { if (e.target.closest('[data-rm]') && $$('.orc-item', box).length > 1) { e.target.closest('.orc-item').remove(); recalc(); } });
      $('[data-add-item]', el).addEventListener('click', () => { box.insertAdjacentHTML('beforeend', itemRow({})); recalc(); });
      F('parceiroId').addEventListener('change', syncCli);
      syncCli(); recalc();
      const salvar = () => {
        const itens = $$('.orc-item', box).map(r => ({ descricao: $('[data-i=descricao]', r).value.trim(), detalhe: $('[data-i=detalhe]', r).value.trim(), qtd: Math.max(1, parseInt($('[data-i=qtd]', r).value, 10) || 1), valorUnit: U.r2(U.num($('[data-i=valorUnit]', r).value)) })).filter(i => i.descricao || i.valorUnit);
        if (!F('titulo').value.trim()) { toast('Informe o título da proposta.', 'error'); F('titulo').focus(); return null; }
        if (!F('parceiroId').value && !F('clienteNome').value.trim()) { toast('Escolha um cliente ou informe o nome do cliente novo.', 'error'); return null; }
        if (!itens.length) { toast('Adicione pelo menos um item.', 'error'); return null; }
        const data = { ...o, id: novo ? null : o.id, parceiroId: F('parceiroId').value, clienteNome: F('clienteNome').value.trim(), clienteWhats: F('clienteWhats').value.trim(), titulo: F('titulo').value.trim(), validade: F('validade').value, servicoId: F('servicoId').value, status: F('status').value, itens, parcelamento: F('parcelamento').value.trim(), aVista: U.r2(U.num(F('aVista').value)), etapas: F('etapas').value.trim(), prazo: F('prazo').value.trim(), pagamento: F('pagamento').value.trim(), obs: F('obs').value.trim() };
        if (novo) { data.numero = DataService.proximoNumero('orcamento'); DataService.confirmarNumero('orcamento'); }
        if (data.status === 'enviado' && !data.enviadoEm) data.enviadoEm = U.today();
        return DataService.upsert('orcamentos', data, 'o');
      };
      $('[data-save]', el).addEventListener('click', () => { const r = salvar(); if (r) { api.close(); render(); toast('Orçamento salvo.'); } });
      $('[data-save-pdf]', el).addEventListener('click', () => { const r = salvar(); if (r) { api.close(); render(); openOrcPdf(r.id); } });
      if (novo && !duplicar && !src) aplicar('identidade');
    }
  });
}

function openOrcPdf(id) {
  if (!PDFService.available()) { toast('A biblioteca de PDF não carregou. Verifique a conexão.', 'error'); return; }
  const o = DataService.get('orcamentos', id); if (!o) return;
  let url = null;

function resumoPeriodo(range) {
  const m = metrics(range);
  const desp = U.sum(despesasNo(range), x => x.valor);
  return { ...m, despesas: desp, lucro: U.r2(m.recebido - desp), ticket: m.entregues.length ? U.r2(m.produzido / m.entregues.length) : 0 };
}

function dadosAno(ano) {
  const meses = Array.from({ length: 12 }, (_, i) => { const ym = `${ano}-${String(i + 1).padStart(2, '0')}`; return { i, ym, ...resumoPeriodo([ym + '-01', U.lastDay(ym)]) }; });
  const tot = resumoPeriodo([`${ano}-01-01`, `${ano}-12-31`]);
  return { meses, tot };
}
function rankingParceiros(range) {
  const m = metrics(range); const by = {};
  m.entregues.forEach(l => { const k = l.parceiroId; if (!by[k]) by[k] = { id: k, nome: nomeParceiroAtual(l), valor: 0, artes: 0, n: 0, aberto: 0, perdido: 0 }; by[k].valor += l.valorTotal; by[k].artes += l.qtd; by[k].n++; if (l.statusPgto === 'pendente') by[k].aberto += l.valorTotal; if (l.statusPgto === 'naopago') by[k].perdido += l.valorTotal; });
  const tot = m.produzido || 1;
  return Object.values(by).sort((a, b) => b.valor - a.valor).map(x => ({ ...x, pct: x.valor / tot * 100, ticket: x.valor / x.n }));
}
function rankingServicos(range) {
  const m = metrics(range); const by = {};
  m.entregues.forEach(l => { if (!by[l.servicoId]) by[l.servicoId] = { nome: l.servicoNome, qtd: 0, valor: 0 }; by[l.servicoId].qtd += l.qtd; by[l.servicoId].valor += l.valorTotal; });
  return Object.values(by).sort((a, b) => b.valor - a.valor);
}

Object.assign(PDFService, {

    if (e.logo) { try { const pr = doc.getImageProperties(e.logo); const h = 15, w = Math.min(40, pr.width * h / pr.height); doc.addImage(e.logo, e.logo.indexOf('image/png') > -1 ? 'PNG' : 'JPEG', M, 10, w, h); hx = M + w + 5; } catch (x) { /* */ } }
    else if (TP.id27) { const lg = Theme.png('logo', TP.logoLetra, TP.logoFlor); if (lg) { try { const h = 17, w = h * ID27.logo.vb[2] / ID27.logo.vb[3]; doc.addImage(lg, 'PNG', M - 1.5, 8.5, w, h); hx = M + w + 5; } catch (x) { /* */ } } }
    else if (TP.brand) { const mk = Theme.png('traco', BRAND.rosa); if (mk) { try { doc.addImage(mk, 'PNG', M - 1, 9.5, 10, 10); hx = M + 11; } catch (x) { /* */ } } }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...TP.ink); doc.text(e.nome || '', hx, 16.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.2); doc.setTextColor(...TP.muted);
    doc.text([e.telefone, e.email].filter(Boolean).join('   |   '), hx, 21.5);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...(TP.titulo || TP.primary)); doc.text(titulo, W - M, 16.5, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...TP.muted); doc.text(sub, W - M, 21.8, { align: 'right' });

    doc.setDrawColor(...TP.line); doc.setLineWidth(0.3); doc.line(M, 32, W - M, 32);

  },
  _footer(ctx, label) {
    const { doc, e, TP, W, H, M } = ctx; const n = doc.getNumberOfPages();

      if (TP.brand) { const fl = Theme.png('flor', TP.flor || BRAND.rosa); if (fl) { try { doc.addImage(fl, 'PNG', W - 30, H - 30, 44, 44); fr = W - 34; } catch (x) { /* */ } } }
      doc.setDrawColor(...TP.line); doc.line(M, H - 15, fr, H - 15);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...TP.muted);
