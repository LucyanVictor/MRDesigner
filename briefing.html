<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --c: #7C5CFF; --c-soft: #f1eefe; --ink: #1f1d2b; --mut: #6b6880; --line: #e7e5ef; --bg: #faf9fc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Poppins, system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  h1, h2, .head { font-family: Lexend, Poppins, sans-serif; letter-spacing: -.015em; line-height: 1.2; }
  body { background: var(--fundo, var(--bg)); }
  .top { position: sticky; top: 0; z-index: 5; background: var(--c); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 20px 10px; }
  .top-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo { height: 36px; max-width: 120px; object-fit: contain; }
  .mono { width: 36px; height: 36px; border-radius: 10px; background: var(--c); color: #fff; display: grid; place-items: center; font-family: Lexend; font-weight: 700; font-size: 14px; }
  .marca { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .salvo { font-size: 12px; color: rgba(255,255,255,.75); white-space: nowrap; }
  .top .logo { background: #fff; border-radius: 9px; padding: 3px 6px; } .top .mono { background: rgba(255,255,255,.16); } .top .mk-svg svg { height: 30px; width: auto; display: block; }
  .bar { max-width: 680px; margin: 10px auto 0; height: 4px; border-radius: 9px; background: rgba(255,255,255,.22); overflow: hidden; }
  .bar i { display: block; height: 100%; background: #fff; border-radius: 9px; transition: width .35s ease; }
  main { max-width: 680px; margin: 0 auto; padding: 28px 20px calc(120px + env(safe-area-inset-bottom)); }
  .tela { animation: in .35s ease both; } @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  .contador { font-size: 13px; font-weight: 600; color: var(--c); margin-bottom: 10px; }
  .perg { font-size: clamp(22px, 4.6vw, 28px); font-weight: 600; margin-bottom: 8px; }
  .perg .req { color: var(--c); }
  .ajuda { color: var(--mut); font-size: 15px; margin-bottom: 20px; }
  textarea, input[type=text] { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 160px; resize: vertical; }
  textarea:focus, input[type=text]:focus { border-color: var(--c); box-shadow: 0 0 0 4px var(--c-soft); }
  .ops { display: grid; gap: 10px; }
  .op { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 16px; text-align: left; font-family: inherit; color: var(--ink); transition: all .12s; width: 100%; }
  .op:hover { border-color: var(--c); }
  .op .mk { width: 22px; height: 22px; flex-shrink: 0; border: 2px solid #c9c6d6; display: grid; place-items: center; transition: all .12s; }
  .op.radio .mk { border-radius: 50%; } .op.chk .mk { border-radius: 7px; }
  .op.on { border-color: var(--c); background: var(--c-soft); } .op.on .mk { border-color: var(--c); background: var(--c); }
  .op.on .mk::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; } .op.chk.on .mk::after { width: 10px; height: 6px; border-radius: 0; background: none; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .outro { margin-top: 10px; }
  .anexos { margin-top: 14px; }
  .up { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; border: 1.5px dashed #c9c6d6; color: var(--mut); cursor: pointer; font-size: 15px; background: #fff; }
  .up:hover { border-color: var(--c); color: var(--c); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .th { position: relative; } .th img { width: 92px; height: 92px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .th button { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
  .erro { color: #dc2626; font-size: 14px; font-weight: 500; margin-top: 10px; min-height: 20px; }
  .rodape { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(250,249,252,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); }
  .rodape-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .btn { font: inherit; font-weight: 600; font-size: 16px; border: 0; cursor: pointer; border-radius: 14px; padding: 14px 22px; transition: transform .1s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(.98); } .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-p { background: var(--c); color: #fff; flex: 1; } .btn-p:hover { filter: brightness(1.06); }
  .btn-g { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .dica { font-size: 12px; color: var(--mut); text-align: center; margin-top: 8px; }
  .capa { text-align: center; padding-top: 4vh; }
  .capa .big-logo { max-height: 90px; max-width: 220px; object-fit: contain; margin: 0 auto 22px; display: block; }
  .capa h1 { font-size: clamp(28px, 6vw, 38px); margin-bottom: 12px; }
  .capa p { color: var(--mut); font-size: 16.5px; max-width: 520px; margin: 0 auto 10px; }
  .meta { display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 14px; font-size: 13.5px; color: var(--mut); }
  .meta span { background: #fff; border: 1px solid var(--line); padding: 6px 12px; border-radius: 99px; }
  .rev { display: grid; gap: 10px; margin-top: 18px; }
  .rv { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; }
  .rv:hover { border-color: var(--c); } .rv small { display: block; font-size: 12.5px; color: var(--mut); font-weight: 600; } .rv div { font-size: 15px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .rv .vazio { color: #b8b5c6; } .rv.falta { border-color: #fca5a5; background: #fff7f7; }
  #hero { position: relative; overflow: hidden; background: var(--c); color: #fff; text-align: center; padding: 34px 20px 110px; }
  #hero:empty { display: none; }
  #hero .deco { position: absolute; inset: 0; pointer-events: none; }
  #hero .deco > * { position: absolute; }
  #hero .deco svg { width: 100%; height: 100%; display: block; }
  #hero .ring { border-radius: 50%; border: 34px solid rgba(255,255,255,.08); }
  #hero .in { position: relative; max-width: 620px; margin: 0 auto; animation: in .5s ease both; }
  #hero .hlogo { display: block; margin: 0 auto 22px; } #hero .hlogo svg { width: min(300px, 74vw); height: auto; display: block; margin: 0 auto; }
  #hero .hcard { display: inline-block; background: #fff; border-radius: 18px; padding: 12px 18px; margin-bottom: 22px; } #hero .hcard img { max-height: 70px; max-width: 200px; display: block; }
  #hero h1 { font-size: clamp(28px, 6vw, 40px); margin-bottom: 12px; color: #fff; }
  #hero p { color: rgba(255,255,255,.82); font-size: 16.5px; max-width: 520px; margin: 0 auto; }
  #hero .meta span { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); color: #fff; }
  main.sobre { padding-top: 0; } main.sobre .lista { margin-top: -80px; position: relative; }
  .lista { display: grid; gap: 14px; margin-top: 30px; }
  .bloco { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; box-shadow: 0 10px 30px -22px rgba(30,20,40,.35); scroll-margin-top: 90px; transition: border-color .15s; }
  .bloco .perg { font-size: clamp(18px, 3.6vw, 21px); } .bloco .ajuda { font-size: 14.5px; margin-bottom: 14px; }
  .bloco textarea { min-height: 120px; } .bloco.falta { border-color: #fca5a5; background: #fffafa; }
  .capa-u { padding-top: 2vh; } .cnt { font-size: 13px; color: var(--mut); white-space: nowrap; }
  @media (max-width: 480px) { .bloco { padding: 18px 16px; border-radius: 16px; } .cnt { display: none; } }
  .fim { text-align: center; padding-top: 10vh; }
  .ok { width: 76px; height: 76px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; margin: 0 auto 20px; animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .carregando { text-align: center; color: var(--mut); padding-top: 30vh; }
  .spin { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--c); border-radius: 50%; animation: sp 1s linear infinite; margin: 0 auto 14px; } @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
