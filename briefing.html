<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --c: #7C5CFF; --c-soft: #f1eefe; --ink: #1f1d2b; --mut: #6b6880; --line: #e7e5ef; --bg: #faf9fc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Poppins, system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  h1, h2, .head { font-family: Lexend, Poppins, sans-serif; letter-spacing: -.015em; line-height: 1.2; }
  .top { position: sticky; top: 0; z-index: 5; background: rgba(250,249,252,.92); backdrop-filter: blur(8px); padding: calc(10px + env(safe-area-inset-top)) 20px 10px; }
  .top-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo { height: 36px; max-width: 120px; object-fit: contain; }
  .mono { width: 36px; height: 36px; border-radius: 10px; background: var(--c); color: #fff; display: grid; place-items: center; font-family: Lexend; font-weight: 700; font-size: 14px; }
  .marca { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .salvo { font-size: 12px; color: var(--mut); white-space: nowrap; }
  .bar { max-width: 680px; margin: 10px auto 0; height: 5px; border-radius: 9px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 9px; transition: width .35s ease; }
  main { max-width: 680px; margin: 0 auto; padding: 28px 20px calc(120px + env(safe-area-inset-bottom)); }
  .tela { animation: in .35s ease both; } @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  .contador { font-size: 13px; font-weight: 600; color: var(--c); margin-bottom: 10px; }
  .perg { font-size: clamp(22px, 4.6vw, 28px); font-weight: 600; margin-bottom: 8px; }
  .perg .req { color: var(--c); }
  .ajuda { color: var(--mut); font-size: 15px; margin-bottom: 20px; }
  textarea, input[type=text] { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 160px; resize: vertical; }
  textarea:focus, input[type=text]:focus { border-color: var(--c); box-shadow: 0 0 0 4px var(--c-soft); }
  .ops { display: grid; gap: 10px; }
  .op { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 16px; text-align: left; font-family: inherit; color: var(--ink); transition: all .12s; width: 100%; }
  .op:hover { border-color: var(--c); }
  .op .mk { width: 22px; height: 22px; flex-shrink: 0; border: 2px solid #c9c6d6; display: grid; place-items: center; transition: all .12s; }
  .op.radio .mk { border-radius: 50%; } .op.chk .mk { border-radius: 7px; }
  .op.on { border-color: var(--c); background: var(--c-soft); } .op.on .mk { border-color: var(--c); background: var(--c); }
  .op.on .mk::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; } .op.chk.on .mk::after { width: 10px; height: 6px; border-radius: 0; background: none; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .outro { margin-top: 10px; }
  .anexos { margin-top: 14px; }
  .up { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; border: 1.5px dashed #c9c6d6; color: var(--mut); cursor: pointer; font-size: 15px; background: #fff; }
  .up:hover { border-color: var(--c); color: var(--c); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .th { position: relative; } .th img { width: 92px; height: 92px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .th button { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
  .erro { color: #dc2626; font-size: 14px; font-weight: 500; margin-top: 10px; min-height: 20px; }
  .rodape { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(250,249,252,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); }
  .rodape-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .btn { font: inherit; font-weight: 600; font-size: 16px; border: 0; cursor: pointer; border-radius: 14px; padding: 14px 22px; transition: transform .1s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(.98); } .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-p { background: var(--c); color: #fff; flex: 1; } .btn-p:hover { filter: brightness(1.06); }
  .btn-g { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .dica { font-size: 12px; color: var(--mut); text-align: center; margin-top: 8px; }
  .capa { text-align: center; padding-top: 4vh; }
  .capa .big-logo { max-height: 90px; max-width: 220px; object-fit: contain; margin: 0 auto 22px; display: block; }
  .capa h1 { font-size: clamp(28px, 6vw, 38px); margin-bottom: 12px; }
  .capa p { color: var(--mut); font-size: 16.5px; max-width: 520px; margin: 0 auto 10px; }
  .meta { display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 14px; font-size: 13.5px; color: var(--mut); }
  .meta span { background: #fff; border: 1px solid var(--line); padding: 6px 12px; border-radius: 99px; }
  .rev { display: grid; gap: 10px; margin-top: 18px; }
  .rv { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; }
  .rv:hover { border-color: var(--c); } .rv small { display: block; font-size: 12.5px; color: var(--mut); font-weight: 600; } .rv div { font-size: 15px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .rv .vazio { color: #b8b5c6; } .rv.falta { border-color: #fca5a5; background: #fff7f7; }
  .lista { display: grid; gap: 14px; margin-top: 30px; }
  .bloco { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; scroll-margin-top: 90px; transition: border-color .15s; }
  .bloco .perg { font-size: clamp(18px, 3.6vw, 21px); } .bloco .ajuda { font-size: 14.5px; margin-bottom: 14px; }
  .bloco textarea { min-height: 120px; } .bloco.falta { border-color: #fca5a5; background: #fffafa; }
  .capa-u { padding-top: 2vh; } .cnt { font-size: 13px; color: var(--mut); white-space: nowrap; }
  @media (max-width: 480px) { .bloco { padding: 18px 16px; border-radius: 16px; } .cnt { display: none; } }
  .fim { text-align: center; padding-top: 10vh; }
  .ok { width: 76px; height: 76px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; margin: 0 auto 20px; animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .carregando { text-align: center; color: var(--mut); padding-top: 30vh; }
  .spin { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--c); border-radius: 50%; animation: sp 1s linear infinite; margin: 0 auto 14px; } @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="top" id="top" hidden><div class="top-in" id="topIn"></div><div class="bar" id="bar" hidden><i id="barI" style="width:0"></i></div></div>
<main id="main"><div class="carregando"><div class="spin"></div>Abrindo o briefing…</div></main>
<div class="rodape" id="rod" hidden><div class="rodape-in" id="rodIn"></div></div>
<script>
/* Mesma URL e chave pública (publishable) do sistema. */
const NUVEM = { url: 'https://gkcdvugrtsozgnyohvyr.supabase.co', chave: 'sb_publishable_C3oe_JnCPkme8oooUIs2MQ_34K76Dky' };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = new URLSearchParams(location.search).get('t') || '';
const LS = 'briefing_resp_' + token;
let B = null, R = {}, idx = -1, salvando = null, timer = null;

async function rpc(fn, body) {
  const r = await fetch(NUVEM.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: NUVEM.chave, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const t = await r.text(); let d = null; try { d = t ? JSON.parse(t) : null; } catch (e) { d = t; }
  if (!r.ok) throw new Error((d && (d.message || d.error)) || 'Erro ' + r.status);
  return d;
}
function tom(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function aplicarMarca() {
  const mk = B.marca || {}, rgb = tom(mk.cor) || [124, 92, 255];
  document.documentElement.style.setProperty('--c', `rgb(${rgb})`);
  document.documentElement.style.setProperty('--c-soft', `rgba(${rgb},.12)`);
  document.title = `${B.titulo}${mk.nome ? ' · ' + mk.nome : ''}`;
  const ini = (mk.nome || 'B').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  $('#topIn').innerHTML = `${mk.logo ? `<img class="logo" src="${mk.logo}" alt="">` : `<span class="mono">${esc(ini)}</span>`}<span class="marca">${esc(mk.nome || '')}</span><span class="salvo" id="salvo"></span>`;
  $('#top').hidden = false;
}
const P = () => (B.modelo && B.modelo.perguntas) || [];
const val = id => R[id] || (R[id] = { t: '', op: [], outro: '', arq: [] });
function preenchida(p) { const v = R[p.id]; if (!v) return false; return !!((v.t || '').trim() || (v.op || []).some(o => o !== '__outro' || (v.outro || '').trim()) || (v.arq || []).length); }
function setSalvo(t) { const s = $('#salvo'); if (s) s.textContent = t; }

function guardar(final = false) {
  try { localStorage.setItem(LS, JSON.stringify(R)); } catch (e) { /* cheio */ }
  clearTimeout(timer);
  if (final) return rpc('briefing_responder', { p_token: token, p_respostas: R, p_finalizar: true });
  setSalvo('salvando…');
  timer = setTimeout(() => { salvando = rpc('briefing_responder', { p_token: token, p_respostas: R, p_finalizar: false }).then(() => setSalvo('✓ salvo'), () => setSalvo('salvo neste aparelho')); }, 1200);
}

function rodape(html) { $('#rodIn').innerHTML = html; $('#rod').hidden = !html; }
function progresso() { const n = P().length; $('#bar').hidden = idx < 0 || idx > n; $('#barI').style.width = Math.round(Math.max(0, Math.min(idx, n)) / n * 100) + '%'; }

function capa() {
  idx = -1; progresso();
  const mk = B.marca || {}, n = P().length, nome = (B.cliente_nome || '').trim();
  $('#main').innerHTML = `<div class="tela capa">
    ${mk.logo ? `<img class="big-logo" src="${mk.logo}" alt="${esc(mk.nome)}">` : ''}
    <h1>${nome ? 'Olá, ' + esc(nome) + '!' : 'Olá!'}<br>${esc(B.titulo)}</h1>
    <p>${esc(B.modelo.intro || 'Responda às perguntas abaixo para começarmos o seu projeto.')}</p>
    <div class="meta"><span>${n} perguntas</span><span>cerca de ${Math.max(3, Math.round(n * 0.8))} min</span><span>salva sozinho</span></div></div>`;
  const temAlgo = P().some(preenchida);
  rodape(`<button class="btn btn-p" id="ir">${temAlgo ? 'Continuar de onde parei' : 'Começar'} →</button>`);
  $('#ir').onclick = () => irPara(temAlgo ? Math.max(0, P().findIndex(p => !preenchida(p))) : 0);
}

function irPara(i) {
  const n = P().length;
  if (i >= n) return revisao();
  idx = i; progresso(); const p = P()[i], v = val(p.id);
  const ops = (p.opcoes || []).concat(p.outro ? ['__outro'] : []);
  let campo = '';
  if (p.tipo === 'curto') campo = `<input type="text" id="tx" value="${esc(v.t)}" placeholder="Digite sua resposta" autocomplete="off">`;
  else if (p.tipo === 'longo') campo = `<textarea id="tx" placeholder="Escreva aqui…">${esc(v.t)}</textarea>`;
  else if (p.tipo === 'unica' || p.tipo === 'multipla') campo = `<div class="ops">${ops.map(o => `<button type="button" class="op ${p.tipo === 'unica' ? 'radio' : 'chk'} ${v.op.includes(o) ? 'on' : ''}" data-o="${esc(o)}"><span class="mk"></span><span>${o === '__outro' ? 'Outro' : esc(o)}</span></button>`).join('')}</div>
    ${p.outro ? `<input type="text" class="outro" id="outro" value="${esc(v.outro)}" placeholder="Qual?" ${v.op.includes('__outro') ? '' : 'hidden'}>` : ''}`;
  const anexa = p.tipo === 'anexo' || p.anexo;
  $('#main').innerHTML = `<div class="tela">
    <div class="contador">Pergunta ${i + 1} de ${n}</div>
    <h2 class="perg">${esc(p.titulo)}${p.obrigatoria ? ' <span class="req">*</span>' : ''}</h2>
    ${p.ajuda ? `<p class="ajuda">${esc(p.ajuda)}</p>` : '<div style="height:12px"></div>'}
    ${campo}
    ${anexa ? `<div class="anexos"><label class="up"><input type="file" accept="image/*" multiple hidden id="arq">📎 ${p.tipo === 'anexo' ? 'Enviar imagens' : 'Anexar imagens (opcional)'}</label><div class="thumbs" id="thumbs"></div></div>` : ''}
    <div class="erro" id="erro"></div></div>`;
  const tx = $('#tx');
  if (tx) { tx.addEventListener('input', () => { v.t = tx.value; $('#erro').textContent = ''; guardar(); }); setTimeout(() => tx.focus({ preventScroll: true }), 50);
    if (p.tipo === 'curto') tx.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); proxima(); } }); }
  document.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => {
    const o = b.dataset.o;
    if (p.tipo === 'unica') v.op = [o]; else v.op = v.op.includes(o) ? v.op.filter(x => x !== o) : v.op.concat(o);
    document.querySelectorAll('.op').forEach(x => x.classList.toggle('on', v.op.includes(x.dataset.o)));
    const ou = $('#outro'); if (ou) { ou.hidden = !v.op.includes('__outro'); if (!ou.hidden && o === '__outro') ou.focus(); }
    $('#erro').textContent = ''; guardar();
    if (p.tipo === 'unica' && o !== '__outro' && !anexa) { const k = idx; setTimeout(() => { if (idx === k) proxima(); }, 260); }
  }));
  const ou = $('#outro'); if (ou) ou.addEventListener('input', () => { v.outro = ou.value; guardar(); });
  if (anexa) { desenhaThumbs(v); $('#arq').addEventListener('change', async e => { for (const f of [...e.target.files].slice(0, 6)) { if ((v.arq || []).length >= 6) { $('#erro').textContent = 'Máximo de 6 imagens por pergunta.'; break; } try { v.arq.push({ n: f.name, d: await reduzir(f) }); } catch (x) { $('#erro').textContent = 'Não consegui ler uma das imagens.'; } } e.target.value = ''; desenhaThumbs(v); guardar(); }); }
  rodape(`<button class="btn btn-g" id="volta">←</button><button class="btn btn-p" id="prox">${i === n - 1 ? 'Revisar respostas' : 'Próxima'} →</button>`);
  $('#volta').onclick = () => i === 0 ? capa() : irPara(i - 1);
  $('#prox').onclick = proxima;
  window.scrollTo({ top: 0 });
}
function desenhaThumbs(v) { const t = $('#thumbs'); if (!t) return; t.innerHTML = (v.arq || []).map((a, k) => `<div class="th"><img src="${a.d}" alt=""><button data-k="${k}" aria-label="Remover">×</button></div>`).join(''); t.querySelectorAll('button').forEach(b => b.onclick = () => { v.arq.splice(+b.dataset.k, 1); desenhaThumbs(v); guardar(); }); }
function proxima() {
  const p = P()[idx]; if (!p) return;
  if (p.obrigatoria && !preenchida(p)) { $('#erro').textContent = 'Essa pergunta é obrigatória.'; return; }
  const v = R[p.id]; if (v && v.op && v.op.includes('__outro') && !(v.outro || '').trim()) { $('#erro').textContent = 'Escreva qual é a outra opção.'; return; }
  irPara(idx + 1);
}
function reduzir(file, max = 1400) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}
function texto(p) { const v = R[p.id] || {}; const t = []; if ((v.op || []).length) t.push(v.op.map(o => o === '__outro' ? 'Outro: ' + (v.outro || '') : o).join(', ')); if ((v.t || '').trim()) t.push(v.t.trim()); if ((v.arq || []).length) t.push(`📎 ${v.arq.length} imagem(ns)`); return t.join('\n'); }
function revisao() {
  idx = P().length; progresso();
  const faltam = P().filter(p => p.obrigatoria && !preenchida(p));
  $('#main').innerHTML = `<div class="tela"><h2 class="perg">Confira suas respostas</h2><p class="ajuda">Toque em uma resposta para editar. Quando estiver tudo certo, envie.</p>
    <div class="rev">${P().map((p, i) => `<button class="rv ${p.obrigatoria && !preenchida(p) ? 'falta' : ''}" data-i="${i}"><small>${i + 1}. ${esc(p.titulo)}</small><div class="${texto(p) ? '' : 'vazio'}">${esc(texto(p) || (p.obrigatoria ? 'Falta responder' : 'Sem resposta'))}</div></button>`).join('')}</div>
    <div class="erro" id="erro">${faltam.length ? `Falta${faltam.length > 1 ? 'm' : ''} ${faltam.length} pergunta${faltam.length > 1 ? 's' : ''} obrigatória${faltam.length > 1 ? 's' : ''}.` : ''}</div></div>`;
  document.querySelectorAll('.rv').forEach(b => b.onclick = () => irPara(+b.dataset.i));
  rodape(`<button class="btn btn-g" id="volta">←</button><button class="btn btn-p" id="env">Enviar briefing ✓</button>`);
  $('#volta').onclick = () => irPara(P().length - 1);
  $('#env').onclick = async () => {
    if (faltam.length) return irPara(P().indexOf(faltam[0]));
    const b = $('#env'); b.disabled = true; b.textContent = 'Enviando…';
    try { if (salvando) await salvando.catch(() => {}); await guardar(true); try { localStorage.removeItem(LS); } catch (e) { /* */ } fim(); }
    catch (e) { b.disabled = false; b.textContent = 'Tentar de novo'; $('#erro').textContent = /grandes/.test(e.message) ? 'As imagens ficaram muito pesadas. Remova algumas e tente de novo.' : /já foi enviado/.test(e.message) ? 'Este briefing já foi enviado.' : 'Não consegui enviar agora. Verifique sua internet e tente de novo: suas respostas estão salvas.'; }
  };
  window.scrollTo({ top: 0 });
}
/* ---------- página única ---------- */
function campoHTML(p, i) {
  const v = val(p.id), ops = (p.opcoes || []).concat(p.outro ? ['__outro'] : []), anexa = p.tipo === 'anexo' || p.anexo;
  let c = '';
  if (p.tipo === 'curto') c = `<input type="text" data-tx="${p.id}" value="${esc(v.t)}" placeholder="Digite sua resposta" autocomplete="off">`;
  else if (p.tipo === 'longo') c = `<textarea data-tx="${p.id}" placeholder="Escreva aqui…">${esc(v.t)}</textarea>`;
  else if (p.tipo === 'unica' || p.tipo === 'multipla') c = `<div class="ops">${ops.map(o => `<button type="button" class="op ${p.tipo === 'unica' ? 'radio' : 'chk'} ${v.op.includes(o) ? 'on' : ''}" data-q="${p.id}" data-o="${esc(o)}"><span class="mk"></span><span>${o === '__outro' ? 'Outro' : esc(o)}</span></button>`).join('')}</div>
    ${p.outro ? `<input type="text" class="outro" data-ou="${p.id}" value="${esc(v.outro)}" placeholder="Qual?" ${v.op.includes('__outro') ? '' : 'hidden'}>` : ''}`;
  return `<section class="bloco" id="q_${p.id}">
    <div class="contador">${i + 1} de ${P().length}</div>
    <h2 class="perg">${esc(p.titulo)}${p.obrigatoria ? ' <span class="req">*</span>' : ''}</h2>
    ${p.ajuda ? `<p class="ajuda">${esc(p.ajuda)}</p>` : '<div style="height:10px"></div>'}
    ${c}
    ${anexa ? `<div class="anexos"><label class="up"><input type="file" accept="image/*" multiple hidden data-arq="${p.id}">📎 ${p.tipo === 'anexo' ? 'Enviar imagens' : 'Anexar imagens (opcional)'}</label><div class="thumbs" data-th="${p.id}"></div></div>` : ''}
    <div class="erro" data-er="${p.id}"></div></section>`;
}
function thumbs(id) { const v = val(id), t = document.querySelector(`[data-th="${id}"]`); if (!t) return; t.innerHTML = (v.arq || []).map((a, k) => `<div class="th"><img src="${a.d}" alt=""><button data-k="${k}" aria-label="Remover">×</button></div>`).join(''); t.querySelectorAll('button').forEach(b => b.onclick = () => { v.arq.splice(+b.dataset.k, 1); thumbs(id); guardar(); contar(); }); }
function contar() { const n = P().length, f = P().filter(preenchida).length; $('#bar').hidden = false; $('#barI').style.width = Math.round(f / n * 100) + '%'; const c = $('#cnt'); if (c) c.textContent = `${f} de ${n} respondidas`; }
function pagina() {
  const mk = B.marca || {}, n = P().length, nome = (B.cliente_nome || '').trim();
  $('#main').innerHTML = `<div class="tela">
    <div class="capa capa-u">${mk.logo ? `<img class="big-logo" src="${mk.logo}" alt="${esc(mk.nome)}">` : ''}
      <h1>${nome ? 'Olá, ' + esc(nome) + '!' : 'Olá!'}<br>${esc(B.titulo)}</h1>
      <p>${esc(B.modelo.intro || 'Responda às perguntas abaixo para começarmos o seu projeto.')}</p>
      <div class="meta"><span>${n} perguntas</span><span>cerca de ${Math.max(3, Math.round(n * 0.8))} min</span><span>salva sozinho</span></div></div>
    <div class="lista">${P().map(campoHTML).join('')}</div>
    <div class="erro" id="erro" style="text-align:center"></div></div>`;
  P().forEach(p => {
    const v = val(p.id), er = () => { const e = document.querySelector(`[data-er="${p.id}"]`); if (e) e.textContent = ''; document.getElementById('q_' + p.id).classList.remove('falta'); };
    const tx = document.querySelector(`[data-tx="${p.id}"]`); if (tx) tx.addEventListener('input', () => { v.t = tx.value; er(); guardar(); contar(); });
    document.querySelectorAll(`.op[data-q="${p.id}"]`).forEach(b => b.addEventListener('click', () => {
      const o = b.dataset.o;
      if (p.tipo === 'unica') v.op = [o]; else v.op = v.op.includes(o) ? v.op.filter(x => x !== o) : v.op.concat(o);
      document.querySelectorAll(`.op[data-q="${p.id}"]`).forEach(x => x.classList.toggle('on', v.op.includes(x.dataset.o)));
      const ou = document.querySelector(`[data-ou="${p.id}"]`); if (ou) { ou.hidden = !v.op.includes('__outro'); if (!ou.hidden && o === '__outro') ou.focus(); }
      er(); guardar(); contar();
    }));
    const ou = document.querySelector(`[data-ou="${p.id}"]`); if (ou) ou.addEventListener('input', () => { v.outro = ou.value; er(); guardar(); });
    const fa = document.querySelector(`[data-arq="${p.id}"]`); if (fa) { thumbs(p.id); fa.addEventListener('change', async e => { for (const f of [...e.target.files].slice(0, 6)) { if (v.arq.length >= 6) { document.querySelector(`[data-er="${p.id}"]`).textContent = 'Máximo de 6 imagens por pergunta.'; break; } try { v.arq.push({ n: f.name, d: await reduzir(f) }); } catch (x) { document.querySelector(`[data-er="${p.id}"]`).textContent = 'Não consegui ler uma das imagens.'; } } e.target.value = ''; thumbs(p.id); guardar(); contar(); }); }
  });
  rodape(`<span class="cnt" id="cnt"></span><button class="btn btn-p" id="env">Enviar briefing ✓</button>`);
  contar();
  $('#env').onclick = enviar;
}
async function enviar() {
  let primeiro = null;
  P().forEach(p => {
    const v = R[p.id], e = document.querySelector(`[data-er="${p.id}"]`), sec = document.getElementById('q_' + p.id);
    let m = '';
    if (p.obrigatoria && !preenchida(p)) m = 'Essa pergunta é obrigatória.';
    else if (v && v.op && v.op.includes('__outro') && !(v.outro || '').trim()) m = 'Escreva qual é a outra opção.';
    if (e) e.textContent = m; sec.classList.toggle('falta', !!m); if (m && !primeiro) primeiro = sec;
  });
  if (primeiro) { const f = P().filter(p => p.obrigatoria && !preenchida(p)).length; $('#erro').textContent = f ? `Falta${f > 1 ? 'm' : ''} ${f} pergunta${f > 1 ? 's' : ''} obrigatória${f > 1 ? 's' : ''}.` : 'Confira os campos marcados.'; primeiro.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const b = $('#env'); b.disabled = true; b.textContent = 'Enviando…';
  try { if (salvando) await salvando.catch(() => {}); await guardar(true); try { localStorage.removeItem(LS); } catch (e) { /* */ } $('#bar').hidden = true; fim(); window.scrollTo({ top: 0 }); }
  catch (e) { b.disabled = false; b.textContent = 'Tentar de novo'; $('#erro').textContent = /grandes/.test(e.message) ? 'As imagens ficaram muito pesadas. Remova algumas e tente de novo.' : /já foi enviado/.test(e.message) ? 'Este briefing já foi enviado.' : 'Não consegui enviar agora. Verifique sua internet e tente de novo: suas respostas estão salvas.'; }
}
function fim(jaEnviado) {
  idx = -1; progresso(); rodape('');
  const mk = B.marca || {}, w = String(mk.whats || '').replace(/\D/g, '');
  $('#main').innerHTML = `<div class="tela fim"><div class="ok"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1 style="font-size:30px;margin-bottom:10px">${jaEnviado ? 'Briefing já enviado' : 'Briefing enviado!'}</h1>
    <p style="color:var(--mut);font-size:16.5px;max-width:460px;margin:0 auto">${jaEnviado ? 'Recebemos suas respostas' + (B.respondido_em ? ' em ' + new Date(B.respondido_em).toLocaleDateString('pt-BR') : '') + '.' : 'Obrigado! Recebi suas respostas e já vou começar a analisar.'} ${mk.nome ? esc(mk.nome) + ' entra em contato com os próximos passos.' : ''}</p>
    ${w ? `<a class="btn btn-g" style="margin-top:24px;text-decoration:none" href="https://wa.me/${w.length <= 11 ? '55' + w : w}" target="_blank" rel="noopener">Falar no WhatsApp</a>` : ''}</div>`;
}
function erro(m) { $('#main').innerHTML = `<div class="tela fim"><h1 style="font-size:26px;margin-bottom:10px">Link indisponível</h1><p style="color:var(--mut)">${esc(m)}</p></div>`; }

(async () => {
  if (!token) return erro('Este endereço está incompleto. Peça o link de novo para quem te enviou.');
  if (!NUVEM.url) return erro('Briefing ainda não configurado.');
  try { B = await rpc('briefing_abrir', { p_token: token }); } catch (e) { return erro(/não encontrado/.test(e.message) ? 'Este briefing não existe mais ou o link está errado. Peça um novo link para quem te enviou.' : 'Não consegui abrir agora. Verifique sua internet e recarregue a página.'); }
  aplicarMarca();
  if (B.status === 'respondido') return fim(true);
  R = B.respostas || {};
  try { const loc = JSON.parse(localStorage.getItem(LS) || 'null'); if (loc && Object.keys(loc).length >= Object.keys(R).length) R = loc; } catch (e) { /* */ }
  pagina();
})();
</script>
